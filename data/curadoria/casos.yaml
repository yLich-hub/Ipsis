# --- fora do recorte de tráfico, por pedido explícito -------------------------
#
# Os dois casos abaixo não são de tráfico. Entraram junto com as teses de roubo
# e de estupro de vulnerável, e trazem `trafico_imputado: false` — a chave que
# impede o checklist de oferecer tráfico privilegiado a quem responde por roubo.
# Continuam valendo as duas regras do topo: nenhum reproduz processo real, e
# todos carregam TODAS as chaves de gatilho, inclusive as desfavoráveis.

- id: caso_roubo_reconhecimento_fotografico
  ordem: 5
  titulo: Roubo majorado, reconhecimento por fotografia e arma não apreendida
  imputacao:
    - dl_2848_1940_art157_caput
    - dl_2848_1940_art157_p2_inc2
    - dl_2848_1940_art157_p2-a_inc1
  narrativa: >-
    Subtração de um telefone celular e de uma mochila em via pública, à noite,
    praticada por dois indivíduos. A vítima descreveu os agentes de forma
    genérica na primeira oitiva e, três dias depois, apontou o acusado a partir
    de uma única fotografia exibida pela autoridade policial em tela de
    computador, sem que outras imagens semelhantes fossem apresentadas e sem
    auto pormenorizado do ato. Nenhuma arma foi apreendida ou periciada; a
    imputação do emprego de arma de fogo apoia-se apenas no relato da vítima. A
    denúncia atribui ao acusado a permanência no veículo utilizado na fuga e não
    descreve ajuste anterior, divisão de tarefas ou distribuição de papéis entre
    os dois agentes. Acusado primário, sem antecedentes, com residência fixa.
