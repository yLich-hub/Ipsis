- id: caso_entrada_em_residencia
  ordem: 4
  titulo: Entrada em residência sem mandado, a partir de denúncia anônima
  narrativa: >-
    Guarnição recebeu denúncia anônima de que havia droga em uma residência e
    dirigiu-se ao local no início da tarde. Sem mandado judicial, os policiais
    ingressaram no imóvel e apreenderam 180 g de cocaína em um armário do
    quarto. Não houve campana prévia, monitoramento nem qualquer diligência
    anterior à entrada; as razões da suspeita foram registradas no boletim
    depois da apreensão. O termo de consentimento foi assinado após a entrada e
    não há registro audiovisual. O acusado é primário, tem residência fixa e
    admitiu a posse da droga.
  imputacao:
    - lei_11343_2006_art33_caput
