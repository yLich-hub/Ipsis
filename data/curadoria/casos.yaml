- id: caso_rodovia_interestadual
  ordem: 2
  titulo: Apreensão em rodovia, majorante interestadual e associação imputadas
  narrativa: >-
    Veículo abordado em rodovia federal que liga dois Estados, com 3,2 kg de
    cocaína em compartimento adaptado no assoalho. No interior do carro havia
    material de embalagem e uma balança de precisão. Viajavam duas pessoas; a
    denúncia imputa a ambas o tráfico, a associação e as majorantes da
    transnacionalidade e da interestadualidade, sem descrever atuação anterior
    conjunta, divisão de tarefas ou qualquer vínculo que anteceda a viagem. A
    transnacionalidade se apoia apenas no laudo que aponta procedência
    estrangeira da substância; não há prova do destino da carga nem elemento
    que indique rota internacional. A sentença usou a quantidade de droga para
    elevar a pena-base e, na terceira fase, a mesma quantidade para fixar a
    fração mínima do § 4º. O acusado é primário e não confessou.
  imputacao:
    - lei_11343_2006_art33_caput
    - lei_11343_2006_art35_caput
    - lei_11343_2006_art40_inc1
