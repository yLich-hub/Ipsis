- id: caso_vigilancia_sem_apreensao
  ordem: 3
  titulo: Acusado que vigiava a entrada da via, sem apreensão em seu poder
  narrativa: >-
    Operação policial em comunidade resultou na apreensão de entorpecente em
    imóvel abandonado. O acusado foi detido a cerca de sessenta metros do local,
    sentado em um muro, sem droga, dinheiro em espécie ou aparelho de rádio em
    seu poder. A denúncia atribui-lhe a função de avisar da chegada de viaturas
    e o inclui no tráfico e na associação, com base no depoimento de dois
    policiais. Reincidente por crime anterior de furto, com laudo de dependência
    química juntado aos autos e anterior aos fatos. Confessou que avisava, em
    troca de droga para consumo próprio.
