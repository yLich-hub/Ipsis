- id: caso_vulneravel_resultado_sem_laudo
  ordem: 6
  titulo: Estupro de vulnerável na forma qualificada pelo resultado, sem laudo pericial
  imputacao:
    - dl_2848_1940_art217-a_caput
    - dl_2848_1940_art217-a_p3
  narrativa: >-
    A denúncia imputa a conduta do art. 217-A na forma qualificada pelo
    resultado do § 3º — lesão corporal de natureza grave —, elevando a pena
    mínima de oito para doze anos. Os autos não trazem exame de corpo de delito
    nem laudo pericial que ateste o resultado; a qualificadora apoia-se em
    relatório de atendimento que registra queixa, sem conclusão pericial sobre a
    natureza da lesão. Não há requerimento de perícia complementar nem
    justificativa para a ausência. O acusado é primário, sem antecedentes, e
    nega os fatos.
  # A vulnerabilidade em si NÃO é objeto de tese, e a razão é o texto expresso:
  # o § 4º-A do art. 217-A diz que a presunção é absoluta e a relativização,
  # inadmissível. A defesa aqui é sobre o RESULTADO qualificador, que depende de
  # perícia como qualquer outro — não sobre a idade da vítima.
  fatos:
