      texto: 'Se do abandono resulta lesão corporal de natureza grave: Pena - reclusão, de 3
        (três) a 7 (sete) anos.'
    - id: 'dl_2848_1940_art133_p2'
      acao: 'alterar'
      tipo: 'paragrafo'
      rotulo: '§ 2º'
      era: 'Se resulta a morte: Pena – reclusão, de quatro a doze anos.'
      texto: 'Se resulta a morte: Pena - reclusão, de 8 (oito) a 14 (quatorze) anos.'
- artigo: 'dl_2848_1940_art136'
  normas:
    - 'Lei 15.163/2025'
  fonte: 'https://www.planalto.gov.br/ccivil_03/decreto-lei/del2848compilado.htm'
  conferido_em: '2026-08-15'
  blocos:
    - id: 'dl_2848_1940_art136_caput'
      acao: 'alterar'
      tipo: 'caput'
      rotulo: 'caput'
      era: 'Expor a perigo a vida ou a saúde de pessoa sob sua autoridade, guarda ou vigilância,
        para fim de educação, ensino, tratamento ou custódia, quer privando-a de alimentação
        ou cuidados indispensáveis, quer sujeitando-a a trabalho excessivo ou inadequado,
        quer abusando de meios de correção ou disciplina: Pena – detenção, de dois meses a
        um ano, ou multa.'
      texto: 'Expor a perigo a vida ou a saúde de pessoa sob sua autoridade, guarda ou vigilância,
        para fim de educação, ensino, tratamento ou custódia, quer privando-a de alimentação
        ou cuidados indispensáveis, quer sujeitando-a a trabalho excessivo ou inadequado,
        quer abusando de meios de correção ou disciplina: Pena - reclusão, de 2 (dois) a 5
        (cinco) anos.'
    - id: 'dl_2848_1940_art136_p1'
      acao: 'alterar'
      tipo: 'paragrafo'
      rotulo: '§ 1º'
      era: 'Se do fato resulta lesão corporal de natureza grave: Pena – reclusão, de um a quatro
        anos.'
      texto: 'Se do fato resulta lesão corporal de natureza grave: Pena - reclusão, de 3 (três) a
        7 (sete) anos.'
    - id: 'dl_2848_1940_art136_p2'
      acao: 'alterar'
      tipo: 'paragrafo'
      rotulo: '§ 2º'
      era: 'Se resulta a morte: Pena – reclusão, de quatro a doze anos.'
      texto: 'Se resulta a morte: Pena - reclusão, de 8 (oito) a 14 (quatorze) anos.'
- artigo: 'dl_2848_1940_art147-b'
  normas:
    - 'Lei 15.123/2025'
  fonte: 'https://www.planalto.gov.br/ccivil_03/decreto-lei/del2848compilado.htm'
  conferido_em: '2026-08-15'
  blocos:
    - id: 'dl_2848_1940_art147-b_pu'
      acao: 'incluir'
      tipo: 'paragrafo'
      rotulo: 'Parágrafo único'
      depois_de: 'dl_2848_1940_art147-b_caput'
      texto: 'A pena é aumentada de metade se o crime é cometido mediante uso de inteligência
        artificial ou de qualquer outro recurso tecnológico que altere imagem ou som da
        vítima.'
- artigo: 'dl_2848_1940_art148'
  normas:
    - 'Lei 15.358/2026'
  fonte: 'https://www.planalto.gov.br/ccivil_03/decreto-lei/del2848compilado.htm'
  conferido_em: '2026-08-15'
  blocos:
    - id: 'dl_2848_1940_art148_p3'
      acao: 'incluir'
      tipo: 'paragrafo'
      rotulo: '§ 3º'
      depois_de: 'dl_2848_1940_art148_p2'
      texto: 'Se cometido por integrante de organização criminosa ultraviolenta, grupo paramilitar
        ou milícia privada, no contexto da atuação ou para a consecução das condutas
        previstas no art. 2º da lei que institui o marco legal do combate ao crime
        organizado no Brasil: Pena - reclusão, de 12 (doze) a 20 (vinte) anos.'
- artigo: 'dl_2848_1940_art155'
  normas:
    - 'Lei 15.358/2026'
    - 'Lei 15.397/2026'
  fonte: 'https://www.planalto.gov.br/ccivil_03/decreto-lei/del2848compilado.htm'
  conferido_em: '2026-08-15'
  blocos:
    - id: 'dl_2848_1940_art155_caput'
      acao: 'alterar'
      tipo: 'caput'
      rotulo: 'caput'
      era: 'Subtrair, para si ou para outrem, coisa alheia móvel: Pena – reclusão, de um a quatro
        anos, e multa.'
      texto: 'Subtrair, para si ou para outrem, coisa alheia móvel: Pena – reclusão, de 1 (um) a 6
        (seis) anos, e multa.'
    - id: 'dl_2848_1940_art155_p1'
      acao: 'alterar'
      tipo: 'paragrafo'
      rotulo: '§ 1º'
      era: 'A pena aumenta-se de um terço, se o crime é praticado durante o repouso noturno.'
      texto: 'A pena aumenta-se de metade, se o crime é praticado durante o repouso noturno.'
    - id: 'dl_2848_1940_art155_p4'
      acao: 'alterar'
      tipo: 'paragrafo'
      rotulo: '§ 4º'
      era: 'A pena é de reclusão de dois a oito anos, e multa, se o crime é cometido:'
      texto: 'A pena é de reclusão, de 2 (dois) a 8 (oito) anos, e multa, se o crime é cometido:'
    - id: 'dl_2848_1940_art155_p4-b'
      acao: 'alterar'
      tipo: 'paragrafo'
      rotulo: '§ 4º-B'
      era: 'A pena é de reclusão, de 4 (quatro) a 8 (oito) anos, e multa, se o furto mediante
        fraude é cometido por meio de dispositivo eletrônico ou informático, conectado ou
        não à rede de computadores, com ou sem a violação de mecanismo de segurança ou a
        utilização de programa malicioso, ou por qualquer outro meio fraudulento análogo.'
      texto: 'A pena é de reclusão, de 4 (quatro) a 10 (dez) anos, e multa, se o furto mediante
        fraude é cometido por meio de dispositivo eletrônico ou informático, conectado ou
        não à rede de computadores, com ou sem a violação de mecanismo de segurança ou a
        utilização de programa malicioso, ou por qualquer outro meio fraudulento análogo.'
    - id: 'dl_2848_1940_art155_p5'
      acao: 'alterar'
      tipo: 'paragrafo'
      rotulo: '§ 5º'
      era: 'A pena é de reclusão de três a oito anos, se a subtração for de veículo automotor que
        venha a ser transportado para outro Estado ou para o exterior.'
      texto: 'A pena é de reclusão, de 4 (quatro) a 10 (dez) anos, e multa, se a subtração for de
        veículo automotor que venha a ser transportado para outro Estado ou para o
        exterior.'
    - id: 'dl_2848_1940_art155_p6'
      acao: 'alterar'
      tipo: 'paragrafo'
      rotulo: '§ 6º'
      era: 'A pena é de reclusão de 2 (dois) a 5 (cinco) anos se a subtração for de semovente
        domesticável de produção, ainda que abatido ou dividido em partes no local da
        subtração.'
      texto: 'A pena é de reclusão, de 4 (quatro) a 10 (dez) anos, e multa, se a subtração for:'
    - id: 'dl_2848_1940_art155_p7'
      acao: 'alterar'
      tipo: 'paragrafo'
      rotulo: '§ 7º'
      era: 'A pena é de reclusão de 4 (quatro) a 10 (dez) anos e multa, se a subtração for de
        substâncias explosivas ou de acessórios que, conjunta ou isoladamente, possibilitem
        sua fabricação, montagem ou emprego.'
      texto: 'A pena é de reclusão, de 4 (quatro) a 10 (dez) anos, e multa, se a subtração for:'
    - id: 'dl_2848_1940_art155_p4_inc5'
      acao: 'incluir'
      tipo: 'inciso'
      rotulo: 'V'
      depois_de: 'dl_2848_1940_art155_p4_inc4'
      texto: 'contra quaisquer bens que comprometam o funcionamento de órgãos da União, de Estado,
        do Distrito Federal ou de Município ou de estabelecimentos públicos ou privados que
        prestem serviços essenciais.'
    - id: 'dl_2848_1940_art155_p6_inc1'
      acao: 'incluir'
      tipo: 'inciso'
      rotulo: 'I'
      depois_de: 'dl_2848_1940_art155_p6'
      texto: 'de semovente domesticável de produção, ainda que abatido ou dividido em partes no
        local da subtração, ou de animal doméstico;'
    - id: 'dl_2848_1940_art155_p6_inc2'
      acao: 'incluir'
      tipo: 'inciso'
      rotulo: 'II'
      depois_de: 'dl_2848_1940_art155_p6'
      texto: 'de aparelho de telefonia celular, de computador, inclusive portátil ou do tipo
        prancheta, ou de qualquer dispositivo eletrônico ou informático semelhante.'
    - id: 'dl_2848_1940_art155_p7_inc1'
      acao: 'incluir'
      tipo: 'inciso'
      rotulo: 'I'
      depois_de: 'dl_2848_1940_art155_p7'
      texto: 'de substâncias explosivas ou de acessórios que, conjunta ou isoladamente,
        possibilitem sua fabricação, montagem ou emprego;'
    - id: 'dl_2848_1940_art155_p7_inc2'
      acao: 'incluir'
      tipo: 'inciso'
      rotulo: 'II'
      depois_de: 'dl_2848_1940_art155_p7'
      texto: 'de arma de fogo.'
    - id: 'dl_2848_1940_art155_p8'
      acao: 'incluir'
      tipo: 'paragrafo'
      rotulo: '§ 8º'
      depois_de: 'dl_2848_1940_art155_p7'
      texto: 'A pena é de reclusão, de 2 (dois) a 8 (oito) anos, e multa, se a subtração for de
        fios, cabos ou equipamentos utilizados para fornecimento ou transmissão de energia
        elétrica ou de telefonia ou para transferência de dados, bem como equipamentos ou
        materiais ferroviários ou metroviários, aplicável, em qualquer caso, o disposto no §
        2º deste artigo.'
    - id: 'dl_2848_1940_art155_p9'
      acao: 'incluir'
      tipo: 'paragrafo'
      rotulo: '§ 9º'
      depois_de: 'dl_2848_1940_art155_p7'
      texto: 'A pena é de reclusão de 4 (quatro) a 10 (dez) anos e multa, se a subtração, para si
        ou para outrem, de coisa alheia móvel é cometida por integrante de organização
        criminosa ultraviolenta, grupo paramilitar ou milícia privada, no contexto da
        atuação ou para a consecução das condutas previstas no art. 2º da lei que institui o
        marco legal do combate ao crime organizado no Brasil.'
- artigo: 'dl_2848_1940_art157'
  normas:
    - 'Lei 15.181/2025'
    - 'Lei 15.358/2026'
    - 'Lei 15.397/2026'
  fonte: 'https://www.planalto.gov.br/ccivil_03/decreto-lei/del2848compilado.htm'
  conferido_em: '2026-08-15'
  blocos:
    - id: 'dl_2848_1940_art157_caput'
      acao: 'alterar'
      tipo: 'caput'
      rotulo: 'caput'
      era: 'Subtrair coisa móvel alheia, para si ou para outrem, mediante grave ameaça ou
        violência a pessoa, ou depois de havê-la, por qualquer meio, reduzido à
        impossibilidade de resistência: Pena – reclusão, de quatro a dez anos, e multa.'
      texto: 'Subtrair coisa móvel alheia, para si ou para outrem, mediante grave ameaça ou
        violência a pessoa, ou depois de havê-la, por qualquer meio, reduzido à
        impossibilidade de resistência: Pena – reclusão, de 6 (seis) a 10 (dez) anos, e
        multa.'
    - id: 'dl_2848_1940_art157_p3_inc2'
      acao: 'alterar'
      tipo: 'inciso'
      rotulo: 'II'
      era: 'morte, a pena é de reclusão de 20 (vinte) a 30 (trinta) anos, e multa.'
      texto: 'morte, a pena é de reclusão, de 24 (vinte e quatro) a 30 (trinta) anos, e multa.'
    - id: 'dl_2848_1940_art157_p1-a'
      acao: 'incluir'
      tipo: 'paragrafo'
      rotulo: '§ 1º-A'
      depois_de: 'dl_2848_1940_art157_p1'
      texto: 'A pena é de reclusão, de 6 (seis) a 12 (doze) anos, e multa, se a subtração for
        cometida contra quaisquer bens que comprometam o funcionamento de órgãos da União,
        de Estado, do Distrito Federal ou de Município ou de estabelecimentos públicos ou
        privados que prestem serviços públicos essenciais.'
    - id: 'dl_2848_1940_art157_p2_inc8'
      acao: 'incluir'
      tipo: 'inciso'
      rotulo: 'VIII'
      depois_de: 'dl_2848_1940_art157_p2_inc7'
      texto: 'se a subtração for de fios, cabos ou equipamentos utilizados para fornecimento ou
        transmissão de energia elétrica ou de telefonia ou para transferência de dados, bem
        como equipamentos ou materiais ferroviários ou metroviários.'
    - id: 'dl_2848_1940_art157_p2_inc9'
      acao: 'incluir'
      tipo: 'inciso'
      rotulo: 'IX'
      depois_de: 'dl_2848_1940_art157_p2_inc7'
      texto: 'se a subtração for de aparelho de telefonia celular, de computador, inclusive
        portátil ou do tipo prancheta, ou de qualquer dispositivo eletrônico ou informático
        semelhante;'
    - id: 'dl_2848_1940_art157_p2_inc10'
      acao: 'incluir'
      tipo: 'inciso'
      rotulo: 'X'
      depois_de: 'dl_2848_1940_art157_p2_inc7'
      texto: 'se a subtração for de arma de fogo.'
    - id: 'dl_2848_1940_art157_p4'
      acao: 'incluir'
      tipo: 'paragrafo'
      rotulo: '§ 4º'
      depois_de: 'dl_2848_1940_art157_p3_inc2'
      texto: 'Se a violência ou grave ameaça é cometida por integrante de organização criminosa
        ultraviolenta, grupo paramilitar ou milícia privada, no contexto da atuação ou para
        a consecução das condutas previstas no art. 2º da lei que institui o marco legal do
        combate ao crime organizado no Brasil, aplica-se em triplo a pena prevista no caput
        deste artigo, desprezadas as demais causas de aumento.'
    - id: 'dl_2848_1940_art157_p5'
      acao: 'incluir'
      tipo: 'paragrafo'
      rotulo: '§ 5º'
      depois_de: 'dl_2848_1940_art157_p3_inc2'
      texto: 'Se o crime previsto no inciso II do § 3º deste artigo é cometido por integrante de
        organização criminosa ultraviolenta, grupo paramilitar ou milícia privada, no
        contexto da atuação ou para a consecução das condutas previstas no art. 2º da lei
        que institui o marco legal do combate ao crime organizado no Brasil, e da violência
        resulta morte: Pena - reclusão, de 20 (vinte) a 40 (quarenta) anos, e multa.'
- artigo: 'dl_2848_1940_art158'
  normas:
    - 'Lei 15.358/2026'
  fonte: 'https://www.planalto.gov.br/ccivil_03/decreto-lei/del2848compilado.htm'
  conferido_em: '2026-08-15'
  blocos:
    - id: 'dl_2848_1940_art158_p4'
      acao: 'incluir'
      tipo: 'paragrafo'
      rotulo: '§ 4º'
      depois_de: 'dl_2848_1940_art158_p3'
      texto: 'Se os crimes previstos neste artigo são cometidos por integrante de organização
        criminosa, grupo paramilitar ou milícia privada, no contexto da atuação ou para a
        consecução das condutas previstas, aplica-se em triplo a respectiva pena.'
- artigo: 'dl_2848_1940_art159'
  normas:
    - 'Lei 15.358/2026'
  fonte: 'https://www.planalto.gov.br/ccivil_03/decreto-lei/del2848compilado.htm'
  conferido_em: '2026-08-15'
  blocos:
    - id: 'dl_2848_1940_art159_p5'
      acao: 'incluir'
      tipo: 'paragrafo'
      rotulo: '§ 5º'
      depois_de: 'dl_2848_1940_art159_p4'
      texto: 'Se os crimes previstos neste artigo são cometidos por integrante de organização
        criminosa ultraviolenta, grupo paramilitar ou milícia privada, no contexto da
        atuação ou para a consecução das condutas previstas no art. 2º da lei que institui o
        marco legal do combate ao crime organizado no Brasil, aumenta-se a respectiva pena
        em 2/3 (dois terços).'
- artigo: 'dl_2848_1940_art168-a'
  normas:
    - 'Lei Complementar 225/2026'
  fonte: 'https://www.planalto.gov.br/ccivil_03/decreto-lei/del2848compilado.htm'
  conferido_em: '2026-08-15'
  blocos:
    - id: 'dl_2848_1940_art168-a_p5'
      acao: 'incluir'
      tipo: 'paragrafo'
      rotulo: '§ 5º'
      depois_de: 'dl_2848_1940_art168-a_p4'
      texto: 'A extinção de punibilidade de que trata o § 2º deste artigo não se aplica ao agente
        declarado devedor contumaz em decisão administrativa definitiva e inscrito no
        Cadastro Informativo dos créditos não quitados do setor público federal (Cadin),
        previsto na Lei nº 10.522, de 19 de julho de 2002.'
    - id: 'dl_2848_1940_art168-a_p6'
      acao: 'incluir'
      tipo: 'paragrafo'
      rotulo: '§ 6º'
      depois_de: 'dl_2848_1940_art168-a_p4'
      texto: 'O fato de o agente deixar de ser considerado devedor contumaz não afasta o disposto
        no § 5º deste artigo em relação aos atos praticados no período em que era assim
        considerado.'
- artigo: 'dl_2848_1940_art171'
  normas:
    - 'Lei 15.397/2026'
  fonte: 'https://www.planalto.gov.br/ccivil_03/decreto-lei/del2848compilado.htm'
  conferido_em: '2026-08-15'
  blocos:
    - id: 'dl_2848_1940_art171_caput'
      acao: 'alterar'
      tipo: 'caput'
      rotulo: 'caput'
      era: 'Obter, para si ou para outrem, vantagem ilícita, em prejuízo alheio, induzindo ou
        mantendo alguém em erro, mediante artifício, ardil, ou qualquer outro meio
        fraudulento: Pena – reclusão, de um a cinco anos, e multa.'
      texto: 'Obter, para si ou para outrem, vantagem ilícita, em prejuízo alheio, induzindo ou
        mantendo alguém em erro, mediante artifício, ardil, ou qualquer outro meio
        fraudulento: Pena – reclusão, de 1 (um) a 5 (cinco) anos, e multa.'
    - id: 'dl_2848_1940_art171_p2-a'
      acao: 'alterar'
      tipo: 'paragrafo'
      rotulo: '§ 2º-A'
      era: 'A pena é de reclusão, de 4 (quatro) a 8 (oito) anos, e multa, se a fraude é cometida
        com a utilização de informações fornecidas pela vítima ou por terceiro induzido a
        erro por meio de redes sociais, contatos telefônicos ou envio de correio eletrônico
        fraudulento, ou por qualquer outro meio fraudulento análogo.'
      texto: 'A pena é de reclusão, de 4 (quatro) a 8 (oito) anos, e multa, se a fraude é cometida
        com a utilização de informações fornecidas pela vítima ou por terceiro induzido a
        erro por meio de redes sociais, contatos telefônicos, envio de correio eletrônico
        fraudulento, duplicação de dispositivo eletrônico ou aplicação de internet, ou por
        qualquer outro meio fraudulento análogo.'
    - id: 'dl_2848_1940_art171_p5'
      acao: 'alterar'
      tipo: 'paragrafo'
      rotulo: '§ 5º'
      era: 'Somente se procede mediante representação, salvo se a vítima for:'
      texto: '(Revogado) I –; II –; III –; IV –.'
    - id: 'dl_2848_1940_art171_p2_inc7'
      acao: 'incluir'
      tipo: 'inciso'
      rotulo: 'VII'
      depois_de: 'dl_2848_1940_art171_p2_inc6'
      texto: 'cede, gratuita ou onerosamente, conta bancária para que nela transitem recursos
        destinados ao financiamento de atividade criminosa ou que dela sejam fruto.'
- artigo: 'dl_2848_1940_art180'
  normas:
    - 'Lei 15.181/2025'
    - 'Lei 15.358/2026'
    - 'Lei 15.397/2026'
    - 'Lei 9.426/1996'
  fonte: 'https://www.planalto.gov.br/ccivil_03/decreto-lei/del2848compilado.htm'
  conferido_em: '2026-08-15'
  blocos:
    - id: 'dl_2848_1940_art180_caput'
      acao: 'alterar'
      tipo: 'caput'
      rotulo: 'caput'
      era: 'Adquirir, receber, transportar, conduzir ou ocultar, em proveito próprio ou alheio,
        coisa que sabe ser produto de crime, ou influir para que terceiro, de boa-fé, a
        adquira, receba ou oculte: Pena – reclusão, de um a quatro anos, e multa.'
      texto: 'Adquirir, receber, transportar, conduzir ou ocultar, em proveito próprio ou alheio,
        coisa que sabe ser produto de crime, ou influir para que terceiro, de boa-fé, a
        adquira, receba ou oculte: Pena – reclusão, de 2 (dois) a 6 (seis) anos, e multa.'
    - id: 'dl_2848_1940_art180_p5'
      acao: 'alterar'
      tipo: 'paragrafo'
      rotulo: '§ 5º'
      era: 'Na hipótese do § 3º, se o criminoso é primário, pode o juiz, tendo em consideração as
        circunstâncias, deixar de aplicar a pena. Na receptação dolosa aplica-se o disposto
        no § 2º do art. 155.'
      texto: '(Revogado)'
    - id: 'dl_2848_1940_art180_p7'
      acao: 'incluir'
      tipo: 'paragrafo'
      rotulo: '§ 7º'
      depois_de: 'dl_2848_1940_art180_p6'
      texto: 'Se a receptação for de fios, cabos ou equipamentos utilizados para fornecimento ou
        transmissão de energia elétrica ou de telefonia, transferência de dados, ou de
        cargas transportadas em modais logísticos ferroviários ou metroviários, aplica-se em
        dobro a pena prevista no caput ou no § 1º deste artigo, conforme o caso.'
    - id: 'dl_2848_1940_art180_p8'
      acao: 'incluir'
      tipo: 'paragrafo'
      rotulo: '§ 8º'
      depois_de: 'dl_2848_1940_art180_p6'
      texto: 'Se os crimes previstos neste artigo são cometidos por integrante de organização
        criminosa ultraviolenta, grupo paramilitar ou milícia privada, no contexto da
        atuação ou para a consecução das condutas previstas no art. 2º da lei que institui o
        marco legal do combate ao crime organizado no Brasil, aumenta-se a respectiva pena
        em 2/3 (dois terços).'
- artigo: 'dl_2848_1940_art180-a'
  normas:
    - 'Lei 15.397/2026'
  fonte: 'https://www.planalto.gov.br/ccivil_03/decreto-lei/del2848compilado.htm'
  conferido_em: '2026-08-15'
  blocos:
    - id: 'dl_2848_1940_art180-a_caput'
      acao: 'alterar'
      tipo: 'caput'
      rotulo: 'caput'
      era: 'Adquirir, receber, transportar, conduzir, ocultar, ter em depósito ou vender, com a
        finalidade de produção ou de comercialização, semovente domesticável de produção,
        ainda que abatido ou dividido em partes, que deve saber ser produto de crime: Pena –
        reclusão, de 2 (dois) a 5 (cinco) anos, e multa.'
      texto: 'Adquirir, receber, transportar, conduzir, ocultar, ter em depósito ou vender, com a
        finalidade de produção ou de comercialização, semovente domesticável de produção,
        ainda que abatido ou dividido em partes, ou animal doméstico, que sabe ou deve saber
        ser produto de crime: Pena – reclusão, de 3 (três) a 8 (oito) anos, e multa.'
- artigo: 'dl_2848_1940_art217-a'
  normas:
    - 'Lei 12.015/2009'
    - 'Lei 15.280/2025'
    - 'Lei 15.353/2026'
  fonte: 'https://www.planalto.gov.br/ccivil_03/decreto-lei/del2848compilado.htm'
  conferido_em: '2026-08-15'
  blocos:
    - id: 'dl_2848_1940_art217-a_caput'
      acao: 'alterar'
      tipo: 'caput'
      rotulo: 'caput'
      era: 'Ter conjunção carnal ou praticar outro ato libidinoso com menor de 14 (catorze) anos:
        Pena – reclusão, de 8 (oito) a 15 (quinze) anos.'
      texto: 'Ter conjunção carnal ou praticar outro ato libidinoso com menor de 14 (catorze)
        anos: Pena – reclusão, de 10 (dez) a 18 (dezoito) anos, e multa.'
    - id: 'dl_2848_1940_art217-a_p3'
      acao: 'alterar'
      tipo: 'paragrafo'
      rotulo: '§ 3º'
      era: 'Se da conduta resulta lesão corporal de natureza grave: Pena – reclusão, de 10 (dez) a
        20 (vinte) anos.'
      texto: 'Se da conduta resulta lesão corporal de natureza grave: Pena – reclusão, de 12
        (doze) a 24 (vinte e quatro) anos, e multa.'
    - id: 'dl_2848_1940_art217-a_p4'
      acao: 'alterar'
      tipo: 'paragrafo'
      rotulo: '§ 4º'
      era: 'Se da conduta resulta morte: Pena – reclusão, de 12 (doze) a 30 (trinta) anos.'
      texto: 'Se da conduta resulta morte: Pena – reclusão, de 20 (vinte) a 40 (quarenta) anos, e
        multa.'
    - id: 'dl_2848_1940_art217-a_p5'
      acao: 'alterar'
      tipo: 'paragrafo'
      rotulo: '§ 5º'
      era: 'As penas previstas no caput e nos §§ 1º, 3º e 4º deste artigo aplicam-se
        independentemente do consentimento da vítima ou do fato de ela ter mantido relações
        sexuais anteriormente ao crime.'
      texto: 'As penas previstas no caput e nos §§ 1º, 3º e 4º deste artigo aplicam-se
        independentemente do consentimento da vítima, de sua experiência sexual, do fato de
        ela ter mantido relações sexuais anteriormente ao crime ou da ocorrência de gravidez
        resultante da prática do crime.'
    - id: 'dl_2848_1940_art217-a_p4-a'
      acao: 'incluir'
      tipo: 'paragrafo'
      rotulo: '§ 4º-A'
      depois_de: 'dl_2848_1940_art217-a_p4'
      texto: 'É absoluta a presunção de vulnerabilidade da vítima e inadmissível sua
        relativização.'
- artigo: 'dl_2848_1940_art218'
  normas:
    - 'Lei 12.015/2009'
    - 'Lei 15.280/2025'
  fonte: 'https://www.planalto.gov.br/ccivil_03/decreto-lei/del2848compilado.htm'
  conferido_em: '2026-08-15'
  blocos:
    - id: 'dl_2848_1940_art218_caput'
      acao: 'alterar'
      tipo: 'caput'
      rotulo: 'caput'
      era: 'Induzir alguém menor de 14 (catorze) anos a satisfazer a lascívia de outrem: Pena –
        reclusão, de 2 (dois) a 5 (cinco) anos.'
      texto: 'Induzir alguém menor de 14 (catorze) anos a satisfazer a lascívia de outrem: Pena –
        reclusão, de 6 (seis) a 14 (quatorze) anos, e multa.'
- artigo: 'dl_2848_1940_art218-a'
  normas:
    - 'Lei 12.015/2009'
    - 'Lei 12.978/2014'
    - 'Lei 15.280/2025'
  fonte: 'https://www.planalto.gov.br/ccivil_03/decreto-lei/del2848compilado.htm'
  conferido_em: '2026-08-15'
  blocos:
    - id: 'dl_2848_1940_art218-a_caput'
      acao: 'alterar'
      tipo: 'caput'
      rotulo: 'caput'
      era: 'Praticar, na presença de alguém menor de 14 (catorze) anos, ou induzi-lo a presenciar,
        conjunção carnal ou outro ato libidinoso, a fim de satisfazer lascívia própria ou de
        outrem: Pena – reclusão, de 2 (dois) a 4 (quatro) anos.'
      texto: 'Praticar, na presença de alguém menor de 14 (catorze) anos, ou induzi-lo a
        presenciar, conjunção carnal ou outro ato libidinoso, a fim de satisfazer lascívia
        própria ou de outrem: Pena – reclusão, de 5 (cinco) a 12 (doze) anos, e multa.
        Favorecimento da prostituição ou de outra forma de exploração sexual de criança ou
        adolescente ou de vulnerável.'
- artigo: 'dl_2848_1940_art218-b'
  normas:
    - 'Lei 12.015/2009'
    - 'Lei 15.280/2025'
  fonte: 'https://www.planalto.gov.br/ccivil_03/decreto-lei/del2848compilado.htm'
  conferido_em: '2026-08-15'
  blocos:
    - id: 'dl_2848_1940_art218-b_caput'
      acao: 'alterar'
      tipo: 'caput'
      rotulo: 'caput'
      era: 'Submeter, induzir ou atrair à prostituição ou outra forma de exploração sexual alguém
        menor de 18 (dezoito) anos ou que, por enfermidade ou deficiência mental, não tem o
        necessário discernimento para a prática do ato, facilitá-la, impedir ou dificultar
        que a abandone: Pena – reclusão, de 4 (quatro) a 10 (dez) anos.'
      texto: 'Submeter, induzir ou atrair à prostituição ou outra forma de exploração sexual
        alguém menor de 18 (dezoito) anos ou que, por enfermidade ou deficiência mental, não
        tem o necessário discernimento para a prática do ato, facilitá-la, impedir ou
        dificultar que a abandone: Pena – reclusão, de 7 (sete) a 16 (dezesseis) anos, e
        multa.'
    - id: 'dl_2848_1940_art218-b_p1'
      acao: 'alterar'
      tipo: 'paragrafo'
      rotulo: '§ 1º'
      era: 'Se o crime é praticado com o fim de obter vantagem econômica, aplica-se também multa.'
      texto: '(Revogado)'
- artigo: 'dl_2848_1940_art218-c'
  normas:
    - 'Lei 13.718/2018'
    - 'Lei 15.280/2025'
  fonte: 'https://www.planalto.gov.br/ccivil_03/decreto-lei/del2848compilado.htm'
  conferido_em: '2026-08-15'
  blocos:
    - id: 'dl_2848_1940_art218-c_caput'
      acao: 'alterar'
      tipo: 'caput'
      rotulo: 'caput'
      era: 'Oferecer, trocar, disponibilizar, transmitir, vender ou expor à venda, distribuir,
        publicar ou divulgar, por qualquer meio – inclusive por meio de comunicação de massa
        ou sistema de informática ou telemática –, fotografia, vídeo ou outro registro
        audiovisual que contenha cena de estupro ou de estupro de vulnerável ou que faça
        apologia ou induza a sua prática, ou, sem o consentimento da vítima, cena de sexo,
        nudez ou pornografia: Pena – reclusão, de 1 (um) a 5 (cinco) anos, se o fato não
        constitui crime mais grave.'
      texto: 'Oferecer, trocar, disponibilizar, transmitir, vender ou expor à venda, distribuir,
        publicar ou divulgar, por qualquer meio - inclusive por meio de comunicação de massa
        ou sistema de informática ou telemática -, fotografia, vídeo ou outro registro
        audiovisual que contenha cena de estupro ou de estupro de vulnerável ou que faça
        apologia ou induza a sua prática, ou, sem o consentimento da vítima, cena de sexo,
        nudez ou pornografia: Pena – reclusão, de 4 (quatro) a 10 (dez) anos, e multa, se o
        fato não constitui crime mais grave.'
- artigo: 'dl_2848_1940_art266'
  normas:
    - 'Lei 15.397/2026'
  fonte: 'https://www.planalto.gov.br/ccivil_03/decreto-lei/del2848compilado.htm'
  conferido_em: '2026-08-15'
  blocos:
    - id: 'dl_2848_1940_art266_caput'
      acao: 'alterar'
      tipo: 'caput'
      rotulo: 'caput'
      era: 'Interromper ou perturbar serviço telegráfico, radiotelegráfico ou telefônico, impedir
        ou dificultar-lhe o restabelecimento: Pena – detenção, de um a três anos, e multa.'
      texto: 'Interromper ou perturbar serviço telegráfico, radiotelegráfico ou telefônico,
        impedir ou dificultar-lhe o restabelecimento: Pena – reclusão, de 2 (dois) a 4
        (quatro) anos, e multa.'
    - id: 'dl_2848_1940_art266_p2'
      acao: 'alterar'
      tipo: 'paragrafo'
      rotulo: '§ 2º'
      era: 'Aplicam-se as penas em dobro se o crime é cometido por ocasião de calamidade pública.'
      texto: 'Aplicam-se as penas em dobro se o crime é cometido:'
    - id: 'dl_2848_1940_art266_p2_inc1'
      acao: 'incluir'
      tipo: 'inciso'
      rotulo: 'I'
      depois_de: 'dl_2848_1940_art266_p2'
      texto: 'por ocasião de calamidade pública;'
    - id: 'dl_2848_1940_art266_p2_inc2'
      acao: 'incluir'
      tipo: 'inciso'
      rotulo: 'II'
      depois_de: 'dl_2848_1940_art266_p2'
      texto: 'mediante subtração, dano ou destruição de equipamento instalado em estrutura
        utilizada para a prestação de serviços de telecomunicações.'
- artigo: 'dl_2848_1940_art282'
  normas:
    - 'Lei 15.425/2026'
  fonte: 'https://www.planalto.gov.br/ccivil_03/decreto-lei/del2848compilado.htm'
  conferido_em: '2026-08-15'
  blocos:
    - id: 'dl_2848_1940_art282_caput'
      acao: 'alterar'
      tipo: 'caput'
      rotulo: 'caput'
      era: 'Exercer, ainda que a título gratuito, a profissão de médico, dentista ou farmacêutico,
        sem autorização legal ou excedendo-lhe os limites: Pena – detenção, de seis meses a
        dois anos.'
      texto: 'Exercer, ainda que a título gratuito, a profissão de médico, médico veterinário,
        dentista ou farmacêutico, sem autorização legal ou excedendo-lhe os limites: Pena –
        detenção, de 6 (seis) meses a 2 (dois) anos.'
    - id: 'dl_2848_1940_art282_p1'
      acao: 'incluir'
      tipo: 'paragrafo'
      rotulo: '§ 1º'
      depois_de: 'dl_2848_1940_art282_caput'
      texto: 'Se o crime é praticado com o fim de lucro, aplica-se também multa.'
    - id: 'dl_2848_1940_art282_p2'
      acao: 'incluir'
      tipo: 'paragrafo'
      rotulo: '§ 2º'
      depois_de: 'dl_2848_1940_art282_caput'
      texto: 'Se do crime resulta lesão corporal de natureza grave ou gravíssima, responde também
        o agente pelos crimes descritos nos §§ 1º e 2º do art. 129 deste Código.'
    - id: 'dl_2848_1940_art282_p3'
      acao: 'incluir'
      tipo: 'paragrafo'
      rotulo: '§ 3º'
      depois_de: 'dl_2848_1940_art282_caput'
      texto: 'Se do crime resulta morte, responde também o agente pelo crime de homicídio, nos
        termos do art. 121 deste Código.'
    - id: 'dl_2848_1940_art282_p4'
      acao: 'incluir'
      tipo: 'paragrafo'
      rotulo: '§ 4º'
      depois_de: 'dl_2848_1940_art282_caput'
      texto: 'Se do crime resulta lesão ou morte de animal, responde também o agente pelo crime
        previsto no art. 32 da Lei nº 9.605, de 12 de fevereiro de 1998 (Lei dos Crimes
        Ambientais).'
    - id: 'dl_2848_1940_art282_p5'
      acao: 'incluir'
      tipo: 'paragrafo'
      rotulo: '§ 5º'
      depois_de: 'dl_2848_1940_art282_caput'
      texto: 'Incorre na conduta prevista no caput deste artigo o agente que exerce a profissão
        durante o período de suspensão ou após o cancelamento da habilitação ou do registro
        profissional.'
- artigo: 'dl_2848_1940_art288'
  normas:
    - 'Lei 15.245/2025'
  fonte: 'https://www.planalto.gov.br/ccivil_03/decreto-lei/del2848compilado.htm'
  conferido_em: '2026-08-15'
  blocos:
    - id: 'dl_2848_1940_art288_p1'
      acao: 'incluir'
      tipo: 'paragrafo'
      rotulo: '§ 1º'
      depois_de: 'dl_2848_1940_art288_caput'
      texto: 'A pena aumenta-se até a metade se a associação é armada ou se houver a participação
        de criança ou adolescente.'
    - id: 'dl_2848_1940_art288_p2'
      acao: 'incluir'
      tipo: 'paragrafo'
      rotulo: '§ 2º'
      depois_de: 'dl_2848_1940_art288_caput'
      texto: 'Incorre na pena prevista no caput deste artigo quem, de qualquer modo, solicitar ou
        contratar o cometimento de crime a integrante de associação criminosa,
        independentemente da aplicação da pena correspondente ao crime solicitado ou
        contratado.'
- artigo: 'dl_2848_1940_art337-a'
  normas:
    - 'Lei Complementar 225/2026'
  fonte: 'https://www.planalto.gov.br/ccivil_03/decreto-lei/del2848compilado.htm'
  conferido_em: '2026-08-15'
  blocos:
    - id: 'dl_2848_1940_art337-a_p5'
      acao: 'incluir'
      tipo: 'paragrafo'
      rotulo: '§ 5º'
      depois_de: 'dl_2848_1940_art337-a_p4'
      texto: 'A extinção de punibilidade de que trata o § 1º deste artigo não se aplica ao agente
        declarado devedor contumaz em decisão administrativa definitiva e inscrito no
        Cadastro Informativo dos créditos não quitados do setor público federal (Cadin),
        previsto na Lei nº 10.522, de 19 de julho de 2002.'
    - id: 'dl_2848_1940_art337-a_p6'
      acao: 'incluir'
      tipo: 'paragrafo'
      rotulo: '§ 6º'
      depois_de: 'dl_2848_1940_art337-a_p4'
      texto: 'O fato de o agente deixar de ser considerado devedor contumaz não afasta o disposto
        no § 5º deste artigo em relação aos atos praticados no período em que era assim
        considerado.'
- artigo: 'dl_2848_1940_art121-b'
  acao: 'criar'
  numero: '121-B'
  depois_de: 'dl_2848_1940_art121-a'
  rubrica: 'Vicaricídio'
  normas:
    - 'Lei 15.384/2026'
  fonte: 'https://www.planalto.gov.br/ccivil_03/decreto-lei/del2848compilado.htm'
  conferido_em: '2026-08-15'
  caput: 'Matar descendente, ascendente, dependente, enteado ou pessoa sob guarda ou
    responsabilidade direta da mulher, com o fim específico de causar-lhe sofrimento,
    punição ou controle, no contexto de violência doméstica e familiar. Pena – reclusão, de
    20 (vinte) a 40 (quarenta) anos.'
  incisos: []
  paragrafos:
    - rotulo: 'Parágrafo único'
      texto: 'A pena do vicaricídio é aumentada de 1/3 (um terço) até a metade se o crime for
        praticado:'
      incisos:
        - rotulo: 'I'
          texto: 'na presença da mulher a quem se pretende causar sofrimento, punição ou controle;'
        - rotulo: 'II'
          texto: 'contra criança ou adolescente ou pessoa idosa ou com deficiência;'
        - rotulo: 'III'
          texto: 'em descumprimento de medida protetiva de urgência.'
- artigo: 'dl_2848_1940_art147-c'
  acao: 'criar'
  numero: '147-C'
  depois_de: 'dl_2848_1940_art147-b'
  rubrica: null
  normas:
    - 'Lei 15.358/2026'
  fonte: 'https://www.planalto.gov.br/ccivil_03/decreto-lei/del2848compilado.htm'
  conferido_em: '2026-08-15'
  caput: 'Ameaçar alguém, por palavra, escrito ou gesto, ou qualquer outro meio simbólico, de
    causar-lhe mal injusto e grave, no contexto da atuação ou para a consecução das condutas
    previstas no art. 2º da lei que institui o marco legal do combate ao crime organizado no
    Brasil: Pena - reclusão, de 1 (um) a 3 (três) anos.'
  incisos: []
  paragrafos: []
- artigo: 'dl_2848_1940_art338-a'
  acao: 'criar'
  numero: '338-A'
  depois_de: 'dl_2848_1940_art338'
  rubrica: 'Descumprimento de medidas protetivas de urgência'
  normas:
    - 'Lei 15.280/2025'
  fonte: 'https://www.planalto.gov.br/ccivil_03/decreto-lei/del2848compilado.htm'
  conferido_em: '2026-08-15'
  caput: 'Descumprir decisão judicial que defere medidas protetivas de urgência: Pena –
    reclusão, de 2 (dois) a 5 (cinco) anos, e multa.'
  incisos: []
  paragrafos:
    - rotulo: '§ 1º'
      texto: 'A configuração do crime independe da competência civil ou criminal do juiz que
        deferiu as medidas.'
    - rotulo: '§ 2º'
      texto: 'Na hipótese de prisão em flagrante, apenas a autoridade judicial pode conceder
        fiança.'
    - rotulo: '§ 3º'
      texto: 'O disposto neste artigo não exclui a aplicação de outras sanções cabíveis.'
- artigo: 'dl_3689_1941_art3-b'
  normas:
    - 'Lei 15.358/2026'
  fonte: 'https://www.planalto.gov.br/ccivil_03/decreto-lei/del3689compilado.htm'
  conferido_em: '2026-08-15'
  blocos:
    - id: 'dl_3689_1941_art3-b_p1'
      acao: 'alterar'
      tipo: 'paragrafo'
      rotulo: '§ 1º'
      era: 'O preso em flagrante ou por força de mandado de prisão provisória será encaminhado à
        presença do juiz de garantias no prazo de 24 (vinte e quatro) horas, momento em que
        se realizará audiência com a presença do Ministério Público e da Defensoria Pública
        ou de advogado constituído, vedado o emprego de videoconferência.'
      texto: 'O preso em flagrante ou por força de mandado de prisão provisória será encaminhado à
        presença do juiz competente para celebração da audiência de custódia no prazo de 24
        (vinte e quatro) horas, momento em que se realizará, por videoconferência, audiência
        com a presença do Ministério Público e da Defensoria Pública ou de advogado
        constituído, na forma estabelecida no art. 310 deste Código.'
- artigo: 'dl_3689_1941_art38'
  normas:
    - 'Lei 15.438/2026'
  fonte: 'https://www.planalto.gov.br/ccivil_03/decreto-lei/del3689compilado.htm'
  conferido_em: '2026-08-15'
  blocos:
    - id: 'dl_3689_1941_art38_p1'
      acao: 'incluir'
      tipo: 'paragrafo'
      rotulo: '§ 1º'
      depois_de: 'dl_3689_1941_art38_caput'
      texto: 'Verificar-se-á a decadência do direito de queixa ou representação, dentro do mesmo
        prazo, nos casos dos arts. 24, parágrafo único, e 31.'
    - id: 'dl_3689_1941_art38_p2'
      acao: 'incluir'
      tipo: 'paragrafo'
      rotulo: '§ 2º'
      depois_de: 'dl_3689_1941_art38_caput'
      texto: 'Nos crimes praticados no âmbito de violência doméstica e familiar contra a mulher, a
        ofendida decairá do direito de queixa ou de representação se não o exercer no prazo
        de 12 (doze) meses, contado do dia em que vier a saber quem é o autor do crime, ou,
        no caso do art. 29 deste Código, do dia em que se esgotar o prazo para o
        oferecimento de denúncia.'
- artigo: 'dl_3689_1941_art78'
  normas:
    - 'Lei 15.358/2026'
  fonte: 'https://www.planalto.gov.br/ccivil_03/decreto-lei/del3689compilado.htm'
  conferido_em: '2026-08-15'
  blocos:
    - id: 'dl_3689_1941_art78_inc1'
      acao: 'alterar'
      tipo: 'inciso'
      rotulo: 'I'
      era: 'no concurso entre a competência do Júri e a de outro órgão da jurisdição comum,
        prevalecerá a competência do Júri;'
      texto: 'no concurso entre a competência do júri e a de outro órgão da jurisdição comum,
        prevalecerá a competência do júri, salvo os casos de homicídios cometidos por
        membros de organizações criminosas ultraviolentas, grupo paramilitar ou milícia
        privada, ou sua tentativa, na forma do art. 2º da lei que institui o marco legal do
        combate ao crime organizado no Brasil; Il - no concurso de jurisdições da mesma
        categoria:'
- artigo: 'dl_3689_1941_art310'
  normas:
    - 'Lei 15.272/2025'
    - 'Lei 15.358/2026'
  fonte: 'https://www.planalto.gov.br/ccivil_03/decreto-lei/del3689compilado.htm'
  conferido_em: '2026-08-15'
  blocos:
    - id: 'dl_3689_1941_art310_caput'
      acao: 'alterar'
      tipo: 'caput'
      rotulo: 'caput'
      era: 'Após receber o auto de prisão em flagrante, no prazo máximo de até 24 (vinte e quatro)
        horas após a realização da prisão, o juiz deverá promover audiência de custódia com
        a presença do acusado, seu advogado constituído ou membro da Defensoria Pública e o
        membro do Ministério Público, e, nessa audiência, o juiz deverá, fundamentadamente:'
      texto: 'Após receber o auto de prisão em flagrante, no prazo máximo de até 24 (vinte e
        quatro) horas após a realização da prisão, o juiz deverá promover, por meio de
        videoconferência em tempo real, audiência de custódia com a presença do acusado, seu
        advogado constituído ou membro da Defensoria Pública e o membro do Ministério
        Público, e, nessa audiência, o juiz deverá, fundamentadamente:'
    - id: 'dl_3689_1941_art310_p5'
      acao: 'incluir'
      tipo: 'paragrafo'
      rotulo: '§ 5º'
      depois_de: 'dl_3689_1941_art310_p4'
      texto: 'São circunstâncias que, sem prejuízo de outras, recomendam a conversão da prisão em
        flagrante em preventiva:'
    - id: 'dl_3689_1941_art310_p5_inc1'
      acao: 'incluir'
      tipo: 'inciso'
      rotulo: 'I'
      depois_de: 'dl_3689_1941_art310_p4'
      texto: 'haver provas que indiquem a prática reiterada de infrações penais pelo agente;'
    - id: 'dl_3689_1941_art310_p5_inc2'
      acao: 'incluir'
      tipo: 'inciso'
      rotulo: 'II'
      depois_de: 'dl_3689_1941_art310_p4'
      texto: 'ter a infração penal sido praticada com violência ou grave ameaça contra a pessoa;'
    - id: 'dl_3689_1941_art310_p5_inc3'
      acao: 'incluir'
      tipo: 'inciso'
      rotulo: 'III'
      depois_de: 'dl_3689_1941_art310_p4'
      texto: 'ter o agente já sido liberado em prévia audiência de custódia por outra infração
        penal, salvo se por ela tiver sido absolvido posteriormente;'
    - id: 'dl_3689_1941_art310_p5_inc4'
      acao: 'incluir'
      tipo: 'inciso'
      rotulo: 'IV'
      depois_de: 'dl_3689_1941_art310_p4'
      texto: 'ter o agente praticado a infração penal na pendência de inquérito ou ação penal;'
    - id: 'dl_3689_1941_art310_p5_inc5'
      acao: 'incluir'
      tipo: 'inciso'
      rotulo: 'V'
      depois_de: 'dl_3689_1941_art310_p4'
      texto: 'ter havido fuga ou haver perigo de fuga; ou'
    - id: 'dl_3689_1941_art310_p5_inc6'
      acao: 'incluir'
      tipo: 'inciso'
      rotulo: 'VI'
      depois_de: 'dl_3689_1941_art310_p4'
      texto: 'haver perigo de perturbação da tramitação e do decurso do inquérito ou da instrução
        criminal, bem como perigo para a coleta, a conservação ou a incolumidade da prova.'
    - id: 'dl_3689_1941_art310_p6'
      acao: 'incluir'
      tipo: 'paragrafo'
      rotulo: '§ 6º'
      depois_de: 'dl_3689_1941_art310_p4'
      texto: 'A decisão de que trata o caput deste artigo deve ser motivada e fundamentada, sendo
        obrigatório o exame, pelo juiz, das circunstâncias previstas nos §§ 2º e 5º deste
        artigo e dos critérios de periculosidade previstos no § 3º do art. 312.'
    - id: 'dl_3689_1941_art310_p7'
      acao: 'incluir'
      tipo: 'paragrafo'
      rotulo: '§ 7º'
      depois_de: 'dl_3689_1941_art310_p4'
      texto: 'Antes do início da audiência de custódia, deverá a serventia judicial conferir os
        processos criminais a que responde o acusado e, constatada pendência de citação em
        qualquer deles, informar ao juiz, que certificará a ocorrência e procederá a citação
        pessoal do acusado, comunicando de imediato o juízo competente.'
    - id: 'dl_3689_1941_art310_p8'
      acao: 'incluir'
      tipo: 'paragrafo'
      rotulo: '§ 8º'
      depois_de: 'dl_3689_1941_art310_p4'
      texto: 'Na audiência de custódia por videoconferência, serão facultados todos os mecanismos
        para intervenção da defesa técnica e do Ministério Público, que poderão suscitar
        questões de ordem.'
    - id: 'dl_3689_1941_art310_p9'
      acao: 'incluir'
      tipo: 'paragrafo'
      rotulo: '§ 9º'
      depois_de: 'dl_3689_1941_art310_p4'
      texto: 'Será garantido o direito de entrevista prévia, reservada e inviolável entre o preso
        e o seu defensor, presencialmente, por videoconferência ou por qualquer outro meio
        de comunicação.'
    - id: 'dl_3689_1941_art310_p10'
      acao: 'incluir'
      tipo: 'paragrafo'
      rotulo: '§ 10'
      depois_de: 'dl_3689_1941_art310_p4'
      texto: 'Deverá ser assegurada privacidade ao preso na sala em que se realizar a
        videoconferência, devendo permanecer sozinho durante a realização de sua oitiva,
        ressalvada a possibilidade de presença física de seu defensor no ambiente.'
    - id: 'dl_3689_1941_art310_p11'
      acao: 'incluir'
      tipo: 'paragrafo'
      rotulo: '§ 11'
      depois_de: 'dl_3689_1941_art310_p4'
      texto: 'No caso de qualquer falha no sistema de comunicações cuja causa seja atribuível ao
        tribunal, por questões internas ou decorrente dos provedores de serviço que o
        tribunal tenha contratado, é obrigatória a repetição completa da audiência, sem
        convalescer qualquer ato incompleto.'
    - id: 'dl_3689_1941_art310_p12'
      acao: 'incluir'
      tipo: 'paragrafo'
      rotulo: '§ 12'
      depois_de: 'dl_3689_1941_art310_p4'
      texto: 'Todos os estabelecimentos prisionais terão salas próprias, com disponibilização de
        mecanismos de videoconferência estáveis, para a realização das audiências de
        custódia.'
    - id: 'dl_3689_1941_art310_p13'
      acao: 'incluir'
      tipo: 'paragrafo'
      rotulo: '§ 13'
      depois_de: 'dl_3689_1941_art310_p4'
      texto: 'Em situações excepcionais decorrentes de força maior, poderá a audiência de custódia
        ser realizada presencialmente, mediante decisão justificada do juiz competente,
        vedada a hipótese se o ato se revelar demasiadamente custoso ou trouxer excessivo
        risco à segurança social ou à segurança física do detido.'
- artigo: 'dl_3689_1941_art312'
  normas:
    - 'Lei 15.272/2025'
  fonte: 'https://www.planalto.gov.br/ccivil_03/decreto-lei/del3689compilado.htm'
  conferido_em: '2026-08-15'
  blocos:
    - id: 'dl_3689_1941_art312_p3'
      acao: 'incluir'
      tipo: 'paragrafo'
      rotulo: '§ 3º'
      depois_de: 'dl_3689_1941_art312_p2'
      texto: 'Devem ser considerados na aferição da periculosidade do agente, geradora de riscos à
        ordem pública:'
    - id: 'dl_3689_1941_art312_p3_inc1'
      acao: 'incluir'
      tipo: 'inciso'
      rotulo: 'I'
      depois_de: 'dl_3689_1941_art312_p2'
      texto: 'o modus operandi, inclusive quanto ao uso reiterado de violência ou grave ameaça à
        pessoa ou quanto à premeditação do agente para a prática delituosa;'
    - id: 'dl_3689_1941_art312_p3_inc2'
      acao: 'incluir'
      tipo: 'inciso'
      rotulo: 'II'
      depois_de: 'dl_3689_1941_art312_p2'
      texto: 'a participação em organização criminosa;'
    - id: 'dl_3689_1941_art312_p3_inc3'
      acao: 'incluir'
      tipo: 'inciso'
      rotulo: 'III'
      depois_de: 'dl_3689_1941_art312_p2'
      texto: 'a natureza, a quantidade e a variedade de drogas, armas ou munições apreendidas; ou'
    - id: 'dl_3689_1941_art312_p3_inc4'
      acao: 'incluir'
      tipo: 'inciso'
      rotulo: 'IV'
      depois_de: 'dl_3689_1941_art312_p2'
      texto: 'o fundado receio de reiteração delitiva, inclusive à vista da existência de outros
        inquéritos e ações penais em curso.'
    - id: 'dl_3689_1941_art312_p4'
      acao: 'incluir'
      tipo: 'paragrafo'
      rotulo: '§ 4º'
      depois_de: 'dl_3689_1941_art312_p2'
      texto: 'É incabível a decretação da prisão preventiva com base em alegações de gravidade
        abstrata do delito, devendo ser concretamente demonstrados a periculosidade do
        agente e seu risco à ordem pública, à ordem econômica, à regularidade da instrução
        criminal e à aplicação da lei penal, conforme o caso.'
- artigo: 'dl_3689_1941_art313'
  normas:
    - 'Lei 15.358/2026'
    - 'Lei 15.487/2026'
  fonte: 'https://www.planalto.gov.br/ccivil_03/decreto-lei/del3689compilado.htm'
  conferido_em: '2026-08-15'
  blocos:
    - id: 'dl_3689_1941_art313_inc5'
      acao: 'incluir'
      tipo: 'inciso'
      rotulo: 'V'
      depois_de: 'dl_3689_1941_art313_inc3'
      texto: 'se o crime for cometido por integrante de organização criminosa ultraviolenta, grupo
        paramilitar ou milícia privada, no contexto da atuação ou para a consecução das
        condutas previstas no art. 2º da lei que institui o marco legal do combate ao crime
        organizado no Brasil.'
    - id: 'dl_3689_1941_art313_inc6'
      acao: 'incluir'
      tipo: 'inciso'
      rotulo: 'VI'
      depois_de: 'dl_3689_1941_art313_inc3'
      texto: 'nos crimes contra a dignidade sexual praticados contra criança ou adolescente ou os
        previstos nos arts. 240 a 241-D e 244-A da Lei nº 8.069, de 13 de julho de 1990
        (Estatuto da Criança e do Adolescente).'
- artigo: 'dl_3689_1941_art584'
  normas:
    - 'Lei 15.358/2026'
  fonte: 'https://www.planalto.gov.br/ccivil_03/decreto-lei/del3689compilado.htm'
  conferido_em: '2026-08-15'
  blocos:
    - id: 'dl_3689_1941_art584_p4'
      acao: 'incluir'
      tipo: 'paragrafo'
      rotulo: '§ 4º'
      depois_de: 'dl_3689_1941_art584_p3'
      texto: 'No caso previsto no inciso V do caput do art. 581, sem prejuízo do disposto no art.
        589 deste Código, a qualquer tempo, até o julgamento, o recorrente poderá pedir ao
        Tribunal ad quem concessão de efeito suspensivo ou ativo ao recurso interposto,
        demonstrando a relevância dos motivos, a plausibilidade do direito alegado e a
        probabilidade de dano irreparável ou de difícil reparação, durante a tramitação.'
- artigo: 'dl_3689_1941_art300-a'
  acao: 'criar'
  numero: '300-A'
  depois_de: 'dl_3689_1941_art300'
  rubrica: null
  normas:
    - 'Lei 15.280/2025'
  fonte: 'https://www.planalto.gov.br/ccivil_03/decreto-lei/del3689compilado.htm'
  conferido_em: '2026-08-15'
  caput: 'O investigado por crimes contra a dignidade sexual, quando preso cautelarmente, e o
    condenado pelos mesmos crimes deverão ser submetidos obrigatoriamente à identificação do
    perfil genético, mediante extração de DNA (ácido desoxirribonucleico), por técnica
    adequada e indolor, por ocasião do ingresso no estabelecimento prisional.'
  incisos: []
  paragrafos: []
- artigo: 'dl_3689_1941_art310-a'
  acao: 'criar'
  numero: '310-A'
  depois_de: 'dl_3689_1941_art310'
  rubrica: null
  normas:
    - 'Lei 15.272/2025'
  fonte: 'https://www.planalto.gov.br/ccivil_03/decreto-lei/del3689compilado.htm'
  conferido_em: '2026-08-15'
  caput: 'No caso de prisão em flagrante por crime praticado com violência ou grave ameaça
    contra a pessoa, por crime contra a dignidade sexual ou por crime praticado por agente
    em relação ao qual existam elementos probatórios que indiquem integrar organização
    criminosa que utilize ou tenha à sua disposição armas de fogo ou em relação ao qual seja
    imputada a prática de crime previsto no art. 1º da Lei nº 8.072, de 25 de julho de 1990
    (Lei dos Crimes Hediondos), o Ministério Público ou a autoridade policial deverá
    requerer ao juiz a coleta de material biológico para obtenção e armazenamento do perfil
    genético do custodiado, na forma da Lei nº 12.037, de 1º de outubro de 2009.'
  incisos: []
  paragrafos:
    - rotulo: '§ 1º'
      texto: 'A coleta de material biológico para a obtenção do perfil genético deverá ser feita,
        preferencialmente, na própria audiência de custódia ou no prazo de 10 (dez) dias,
        contado de sua realização.'
    - rotulo: '§ 2º'
      texto: 'A coleta de material biológico será realizada por agente público treinado e
        respeitará os procedimentos de cadeia de custódia definidos pela legislação em vigor
        e complementados pelo órgão de perícia oficial de natureza criminal.'
- artigo: 'dl_3689_1941_art350-a'
  acao: 'criar'
  numero: '350-A'
  depois_de: 'dl_3689_1941_art350'
  rubrica: null
  normas:
    - 'Lei 15.280/2025'
  fonte: 'https://www.planalto.gov.br/ccivil_03/decreto-lei/del3689compilado.htm'
  conferido_em: '2026-08-15'
  caput: 'Constatada a existência de indícios da prática de crime contra a dignidade sexual, o
    juiz poderá aplicar, de imediato, ao autor, em conjunto ou separadamente, as seguintes
    medidas protetivas de urgência, entre outras:'
  incisos:
    - rotulo: 'I'
      texto: 'suspensão da posse ou restrição do porte de armas, com comunicação ao órgão
        competente, nos termos da Lei nº 10.826, de 22 de dezembro de 2003 (Estatuto do
        Desarmamento);'
    - rotulo: 'II'
      texto: 'afastamento do lar, domicílio ou local de convivência com a vítima, se aplicável;'
    - rotulo: 'III'
      texto: 'proibição de determinadas condutas, entre as quais:'
      alineas:
        - rotulo: 'a)'
          texto: 'aproximação da vítima, de seus familiares e das testemunhas, fixando o limite mínimo
            de distância entre esses e o autor;'
        - rotulo: 'b)'
          texto: 'contato com a vítima, seus familiares e testemunhas por qualquer meio de
            comunicação;'
        - rotulo: 'c)'
          texto: 'frequentação de determinados lugares a fim de preservar a integridade física e
            psicológica da vítima;'
    - rotulo: 'IV'
      texto: 'restrição ou suspensão de visitas aos dependentes menores, ouvida a equipe de
        atendimento multidisciplinar ou serviço similar;'
    - rotulo: 'V'
      texto: 'prestação de alimentos provisionais ou provisórios;'
    - rotulo: 'VI'
      texto: 'comparecimento do autor a programas de recuperação e reeducação;'
    - rotulo: 'VII'
      texto: 'acompanhamento psicossocial do autor, por meio de atendimento individual e/ou em
        grupo de apoio.'
  paragrafos:
    - rotulo: '§ 1º'
      texto: 'As medidas referidas neste artigo não impedem a aplicação de outras previstas na
        legislação em vigor, sempre que a segurança da vítima ou as circunstâncias o
        exigirem, devendo a providência ser comunicada ao Ministério Público.'
    - rotulo: '§ 2º'
      texto: 'Na hipótese de aplicação do inciso I do caput deste artigo, encontrando-se o autor
        nas condições mencionadas no caput e nos incisos do art. 6º da Lei nº 10.826, de 22
        de dezembro de 2003 (Estatuto do Desarmamento), o juiz comunicará ao respectivo
        órgão, corporação ou instituição as medidas protetivas de urgência concedidas e
        determinará a restrição do porte de armas, ficando o superior imediato do autor
        responsável pelo cumprimento da determinação judicial, sob pena de incorrer nos
        crimes de prevaricação ou de desobediência, conforme o caso.'
    - rotulo: '§ 3º'
      texto: 'Para garantir a efetividade das medidas protetivas de urgência, poderá o juiz
        requisitar, a qualquer momento, auxílio da força policial.'
    - rotulo: '§ 4º'
      texto: 'Aplica-se às hipóteses previstas neste artigo, no que couber, o disposto na Lei nº
        13.105, de 16 de março de 2015 (Código de Processo Civil).'
    - rotulo: '§ 5º'
      texto: 'Nos casos previstos neste artigo, a medida protetiva de urgência será cumulada com a
        sujeição do autor a monitoração eletrônica, disponibilizando-se à vítima dispositivo
        de segurança que alerte sobre sua eventual aproximação.'
    - rotulo: '§ 6º'
      texto: 'O disposto neste artigo aplica-se, ainda, aos crimes cuja vítima esteja em situação
        de vulnerabilidade, como crianças, adolescentes, pessoas com deficiência ou
        incapazes, qualquer que seja o crime investigado.'
- artigo: 'dl_3689_1941_art350-b'
  acao: 'criar'
  numero: '350-B'
  depois_de: 'dl_3689_1941_art350'
  rubrica: null
  normas:
    - 'Lei 15.280/2025'
  fonte: 'https://www.planalto.gov.br/ccivil_03/decreto-lei/del3689compilado.htm'
  conferido_em: '2026-08-15'
  caput: 'Em qualquer fase da investigação policial ou do processo penal, a pedido da
    autoridade policial, do Ministério Público ou da vítima, o juiz poderá determinar a
    proibição do autor de exercer atividades que envolvam contato direto com pessoa em
    situação de vulnerabilidade, quando houver prova da existência do crime, indício
    suficiente de autoria e perigo gerado pelo estado de liberdade do imputado.'
  incisos: []
  paragrafos: []
- artigo: 'dl_2848_1940_art359-m-a'
  acao: 'criar'
  numero: '359-M-A'
  depois_de: 'dl_2848_1940_art359-m'
  rubrica: null
  normas:
    - 'Lei 15.402/2026'
  fonte: 'https://www.planalto.gov.br/ccivil_03/decreto-lei/del2848compilado.htm'
  conferido_em: '2026-08-15'
  caput: 'Quando os delitos deste Capítulo estão inseridos no mesmo contexto, a pena deverá
    ser aplicada, ainda que existente desígnio autônomo, na forma do concurso formal próprio
    de que trata a primeira parte do art. 70, vedando-se a aplicação do cômputo cumulativo
    previsto na segunda parte desse dispositivo e no art. 69, todos deste Código.'
  incisos: []
  paragrafos: []
- artigo: 'dl_2848_1940_art359-m-b'
  acao: 'criar'
  numero: '359-M-B'
  depois_de: 'dl_2848_1940_art359-m'
  rubrica: null
  normas:
    - 'Lei 15.402/2026'
  fonte: 'https://www.planalto.gov.br/ccivil_03/decreto-lei/del2848compilado.htm'
  conferido_em: '2026-08-15'
  caput: 'Quando os crimes previstos neste Capítulo forem praticados em contexto de multidão,
    a pena será reduzida de 1/3 (um terço) a 2/3 (dois terços), desde que o agente não tenha
    praticado ato de financiamento ou exercido papel de liderança.'
  incisos: []
  paragrafos: []
