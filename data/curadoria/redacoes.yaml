# =============================================================================
# Redações posteriores à data de corte — a segunda fonte do corpus
#
# **O problema que este arquivo resolve.** O corpus é a fotografia do Vade Mecum
# Senado Federal de 28/02/2025. A vigília do Planalto encontrou 63 alterações
# posteriores a essa data, duas delas na Lei de Drogas — e o conserto que o
# projeto previa ("rodar o vade_parser.py sobre a nova redação") não existe: o
# PDF *é* a fotografia. A redação nova não está nele e nunca vai estar.
#
# Sem uma segunda fonte, o sistema fica para sempre sabendo que está
# desatualizado. Citar redação revogada em peça criminal é grave, e um aviso na
# tela não conserta o texto que sai no .docx.
#
# **De onde vem cada linha.** Do texto compilado do Planalto, extraído por
# `coletores/redacao.py` e conferido bloco a bloco contra o corpus. Nada aqui foi
# digitado de memória: digitar seria produzir texto legal fora da fonte, que é o
# que a decisão nº 1 proíbe. O extrator PROPÕE (em
# `data/vigilia/redacoes.propostas.yaml`); quem confere e assina é gente, e a
# assinatura é o `conferido_em` de cada entrada.
#
# **A conferência não foi só dos artigos apontados.** A comparação roda sobre as
# três leis inteiras — 1.330 artigos —, e artigo que ninguém alterou tem de bater
# com o corpus. As divergências que sobram sem norma posterior à data de corte
# ficam no relatório da proposta e NÃO entram aqui: são o Vade Mecum e o Planalto
# imprimindo a mesma lei com ortografia diferente (`seqüestro`, `Assembléias`),
# não mudança de lei.
#
# **Três travas, porque isto reescreve texto legal:**
#
# 1. `era` é o texto atual do corpus, exato. `scripts/normalize.ts` aborta se ele
#    não casar — nenhuma redação se aplica no escuro, como em `emendas.yaml`.
# 2. Entrada que não casa com nenhum dispositivo aborta o script. Curadoria
#    obsoleta é tão perigosa quanto curadoria ausente.
# 3. `dispositivos.texto_bruto` continua guardando o que o Vade Mecum dizia. O
#    que mudou fica auditável em `npm run audit`, com a regra `redacao`.
#
# **O que isto NÃO faz:** apagar a data de corte. `leis.vigencia_ate` continua
# 28/02/2025, porque é a data da fotografia que cobre os outros 1.284 artigos.
# O que muda é que o artigo conferido passa a carregar a própria data e a lei que
# o alterou — `artigos.conferido_em` e `artigos.alterado_por` —, e a tela mostra
# as duas coisas. Uma data só para o corpus inteiro passou a ser mentira nos dois
# sentidos no momento em que o primeiro artigo foi atualizado.
#
# Gerado a partir da proposta e revisado em 15/08/2026. Para reconferir:
#
#     .venv/Scripts/python -m coletores.redacao --sem-cache
# =============================================================================
