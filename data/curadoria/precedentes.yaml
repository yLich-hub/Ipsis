# =============================================================================
# Precedentes qualificados do STJ — o que entra e por quê
#
# Fonte: Portal de Dados Abertos do STJ, dataset `precedentes-qualificados`,
# licença Creative Commons Atribuição. São temas repetitivos, IACs,
# controvérsias e afins — o que o STJ trata como precedente de observância
# qualificada, com situação controlada.
#
# **Por que este arquivo é separado de `vigilia.yaml`.** A vigília pergunta
# "alguém ALTEROU a lei?"; aqui a pergunta é "como o STJ INTERPRETA a lei?".
# São dois filtros com estruturas diferentes: o da vigília exige verbo de
# alteração, e este não pode exigir — um tema não altera nada, ele fixa
# entendimento. Unir os dois num arquivo só faria um dos dois carregar regra que
# não usa.
#
# **Por que precedente qualificado e não ementa.** As ementas do STJ também são
# abertas e há muito mais delas (718 sobre a Lei 11.343 num mês, numa turma só),
# mas o dump de ementas NÃO tem campo de vigência: medido em 14/08/2026, `tema`
# e `termosAuxiliares` vêm vazios em 3.326 de 3.326 registros. Não dá para saber
# se o entendimento foi superado.
#
# O dataset de temas tem `situacao`, `entendimentoAnterior` e o histórico de
# mudança em `informacoesComplementares` — é o equivalente honesto de
# `leis.vigencia_ate` para jurisprudência. Sem isso, o projeto estaria fazendo
# exatamente o que a decisão nº 3 existe para impedir, só que com acórdão.
#
# Curadoria manual, versionada, revisável em diff.
# =============================================================================

# O endereço do dataset no CKAN do STJ. O recurso é achado pelo nome, não por
# id fixo: o STJ republica o arquivo e o id muda a cada versão.
fonte:
  ckan: https://dadosabertos.web.stj.jus.br/api/3/action/package_show
  dataset: precedentes-qualificados
  recurso: Temas.csv

# --- o que entra -------------------------------------------------------------

# 1. Tudo que fala do recorte. Sem exigir verbo: um tema sobre tráfico interessa
#    quer ele use a palavra "altera" ou não.
drogas: '11\.?343|lei de drogas|tr[áa]fico de drogas|lei antidrogas'

# 2. Parte geral do Código Penal.
#
# Estes artigos valem para QUALQUER crime, inclusive tráfico — dosimetria,
# atenuantes, agravantes, concurso, prescrição, progressão. Um tema sobre a
# compensação da confissão com a reincidência (Tema 585) é tão útil numa defesa
# de tráfico quanto num roubo.
#
# **A lista é fechada de propósito.** Aceitar "qualquer artigo do CP" traria 53
# temas a mais sobre homicídio, roubo e estelionato — crimes fora do recorte,
# que encheriam a tela sem servir a nenhuma tese. Medido em 14/08/2026: com a
# lista, 27 temas de parte geral; sem ela, 80.
#
# Artigo novo aqui é decisão de produto, não ajuste técnico.
parte_geral_cp:
  - 33    # regimes de cumprimento
  - 42    # detração
  - 44    # penas restritivas de direitos
  - 59    # circunstâncias judiciais — a primeira fase
  - 61    # agravantes
  - 62    # agravantes no concurso de pessoas
  - 63    # reincidência
  - 64    # prazo da reincidência
  - 65    # atenuantes — inclui a confissão espontânea
  - 66    # atenuante inominada
  - 67    # concurso de circunstâncias
  - 68    # o critério trifásico
  - 69    # concurso material
  - 70    # concurso formal
  - 71    # crime continuado
  - 107   # extinção da punibilidade
  - 109   # prescrição pela pena máxima
  - 110   # prescrição pela pena aplicada
  - 112   # termo inicial da prescrição da pretensão executória
  - 115   # redução do prazo por idade
  - 117   # interrupção da prescrição

# Reconhece a menção ao Código Penal, para os artigos acima não casarem quando
# a frase fala de artigo de outra lei. `(?!\s+militar)` pelo mesmo motivo da
# vigília: o CPM é o Decreto-Lei 1.001/1969, que o banco não tem.
codigo_penal: 'c[óo]digo penal(?!\s+militar)|2\.?848'

# --- situações que pedem destaque na tela ------------------------------------
#
# O STJ usa vocabulário próprio. Estas são as que significam "não use sem
# conferir": o entendimento não está firme, ou deixou de valer.
#
# Tema cancelado continua no banco de propósito. Sumir com ele faria a tela
# esquecer o que já foi verdade — e é justamente isso que um advogado precisa
# saber ao encontrar a tese num texto antigo.
situacoes_de_alerta:
  - Cancelada
  - Cancelado
  - Sobrestado
  - Suspenso
  - Revisado
  - Em Julgamento
  - Afetado

# --- vínculo curado: os temas que o grafo não alcança ------------------------
#
# **O problema.** Um precedente entra no contexto do chat por interseção de
# artigo: ele aparece quando compartilha artigo com um dispositivo que a busca
# recuperou. Quem não tem artigo vinculado é inalcançável — está na tela, não
# está no chat.
#
# Seis dos dezoito citáveis estavam nessa situação, e não por descuido do
# extrator: `artigos_de` recusa atribuir artigo quando a frase numera mais de um
# diploma, porque "art. 42 do Código Penal" e "Decreto n. 11.846/2023" na mesma
# tese produziriam `lei_11343_2006_art42` — um id que existe, aponta para o
# artigo errado e não levantaria suspeita de ninguém. A recusa está certa; o que
# faltava era o caminho para quem lê a tese decidir.
#
# **É o mesmo desenho de `rubricas.yaml`.** Lá, o que a extração automática não
# alcança ("tráfico privilegiado" não está escrito no art. 33) é escrito à mão,
# em arquivo versionado e revisável em diff. Aqui igual — e com o mesmo limite:
# vínculo é para o tema que o extrator NÃO resolveu, e cada linha diz por quê.
#
# `artigos` são ids de ARTIGO do corpus (`lei_11343_2006_art33`), não de
# dispositivo: é a granularidade em que `precedentes_stj.artigos_tocados` vive e
# em que o cruzamento com `teses.fundamentos` acontece.
#
# O vínculo curado VENCE a extração automática quando os dois existem. Não é
# preferência: é que alguém leu a tese inteira aqui, e o extrator leu uma frase.
vinculos:
  'stj:3765':
    tema: IAC 16 — cânhamo industrial não é droga proscrita
    artigos: [lei_11343_2006_art1, lei_11343_2006_art2]
    porque: >
      A tese firma o alcance da definição legal de droga, e ela cita os dois
      artigos que a fixam: o parágrafo único do art. 1º (droga é o que está em
      lista da União) e o caput do art. 2º (fica proibido tudo que a lista
      alcança). Não é tema sobre o art. 33 — é sobre o que, antes dele, conta
      como droga.

  'stj:448':
    tema: Tema 191 — retroatividade da Lei de Drogas, vedada a combinação de leis
    artigos: [lei_11343_2006_art33, dl_2848_1940_art2]
    porque: >
      A pergunta prática é se o § 4º do art. 33 alcança condenação da Lei
      6.368/1976, e a regra que a responde é a do art. 2º do Código Penal — lei
      posterior mais favorável retroage. Os dois artigos, porque o tema vive
      exatamente na junção deles: a lei nova é a Lei de Drogas e o comando de
      retroatividade é do Código.

  'stj:2828':
    tema: Tema 1052 — prova da menoridade para a majorante do art. 40, VI
    artigos: [lei_11343_2006_art40]
    porque: >
      A tese diz o que basta para provar a menoridade que aciona o inciso VI do
      art. 40. Só este artigo do corpus: o art. 244-B do ECA, que ela cita ao
      lado, é lei que o banco não tem, e inventar vínculo para ela seria apontar
      para um artigo que não existe aqui.

  'stj:4363':
    tema: Tema 1277 — prisão provisória computada para indulto e comutação
    artigos: [dl_2848_1940_art42]
    porque: >
      A tese nomeia o art. 42 do Código Penal (detração) e é sobre a extensão
      dele. O decreto de indulto muda a cada ano e não está no corpus; o artigo
      que o tema interpreta, sim.

  'stj:4517':
    tema: Tema 1336 — indulto não alcança o tráfico, salvo o privilegiado
    artigos: [lei_11343_2006_art33]
    porque: >
      Caput, § 1º e § 4º do art. 33 — a tese trata dos três, e é o § 4º que
      inverte o resultado. É a resposta mais próxima do recorte entre as seis, e
      era invisível para o chat.

  'stj:841':
    tema: Tema 585 — confissão espontânea compensada com a reincidência
    artigos: [dl_2848_1940_art61, dl_2848_1940_art65, dl_2848_1940_art67]
    porque: >
      A segunda fase da dosimetria inteira: a agravante do art. 61, I (que a
      tese nomeia), a atenuante da confissão do art. 65, III, "d", e a regra de
      preponderância do art. 67, que é o que autoriza compensar uma com a outra.
      Vale para qualquer defesa criminal, não só para tráfico.
