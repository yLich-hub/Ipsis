    - { id: dl_2848_1940_art157_p3_inc1, papel: correlato, peso: 90, nota: o outro resultado do § 3º — lesão corporal grave }
    - { id: dl_2848_1940_art157_caput, papel: requisito, peso: 70 }

- termo: roubo impróprio
  slug: roubo-improprio
  tipo: tema
  explicacao: >-
    O § 1º do art. 157: a violência ou a grave ameaça vem DEPOIS da subtração,
