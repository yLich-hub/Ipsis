# --- pena: os clusters que atravessam as duas leis ---------------------------

- termo: dosimetria da pena
  slug: dosimetria-da-pena
  tipo: tema
  explicacao: >-
    Cluster de três dispositivos, em ordem de aplicação no tráfico: o art. 42 da
    Lei de Drogas manda a natureza e a quantidade da droga PREPONDERAREM sobre as
    circunstâncias do art. 59 do Código Penal; o art. 68 dá o método trifásico.
  # As variantes com 12+ caracteres são as que casam CONTIDAS na frase (CTE `rub`,
  # migration 0011), e é por elas que uma pergunta inteira alcança o cluster.
  # "pena-base" foi o buraco mais caro deste arquivo: medido na busca, a consulta
  # `pena-base no tráfico` devolvia o art. 57 do CP e o art. 689 do CPP — nada a
  # ver com dosimetria, nada a ver com drogas. Nenhuma variante daqui aparecia na
  # frase, a perna de rubrica não disparava, e sobravam léxico e vetor, que erram
  # feio justamente onde o apelido é o que identifica o instituto.
  variantes:
    - dosimetria
    - dosimetria do tráfico
    - dosimetria da pena na lei de drogas
    - dosagem da pena
    - método trifásico
    - três fases da pena
    - como calcular a pena do tráfico
    - pena-base
    - pena base
    - pena-base no tráfico
    - pena base no tráfico
    - fixação da pena-base
    - primeira fase da dosimetria
    - circunstâncias judiciais
    - cálculo da pena no tráfico
  dispositivos:
    - { id: lei_11343_2006_art42_caput, papel: principal, peso: 100, nota: preponderância sobre o art. 59 — é o que distingue a dosimetria do tráfico }
    - { id: dl_2848_1940_art59_caput, papel: correlato, peso: 80 }
    - { id: dl_2848_1940_art68_caput, papel: correlato, peso: 70 }

