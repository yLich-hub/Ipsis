# --- patrimônio: o que a rubrica oficial não alcança ----------------------------
#
# O Código Penal já está no corpus inteiro, e o Vade Mecum imprime rubrica
# marginal nele — "Furto", "Furto qualificado", "Roubo" e "Extorsão" são
# `oficial` e já existem. O que falta é o mesmo de sempre: o APELIDO. Nenhum dos
# termos abaixo aparece no texto da lei, e é por eles que se procura.

- termo: furto privilegiado
  slug: furto-privilegiado
  tipo: tema
  explicacao: >-
    O § 2º do art. 155 permite ao juiz substituir a reclusão por detenção,
    diminuí-la de um a dois terços ou aplicar só a multa, quando o réu é primário
    e a coisa furtada é de pequeno valor. São dois requisitos cumulativos, e o
    "pequeno valor" é aferido no momento do crime — não se confunde com o
    princípio da insignificância, que é construção jurisprudencial e não tem
    dispositivo no Código.
  variantes:
    - privilégio no furto
    - furto de pequeno valor
    - furto mínimo
    - primário e pequeno valor
    - redução de pena no furto
    - substituição da pena no furto
  dispositivos:
    - { id: dl_2848_1940_art155_p2, papel: principal, peso: 100, nota: primário + coisa de pequeno valor — substituição, redução de 1/3 a 2/3 ou só multa }
    - { id: dl_2848_1940_art155_caput, papel: requisito, peso: 90, nota: o tipo sobre o qual o privilégio incide }
    - { id: dl_2848_1940_art155_p4, papel: correlato, peso: 60, nota: o qualificado, para separar o que reduz do que agrava }

- termo: repouso noturno
  slug: repouso-noturno
  tipo: tema
  explicacao: >-
    Causa de aumento de metade, no § 1º do art. 155. Não é qualificadora e não
    entra no § 4º: incide na terceira fase, sobre a pena já fixada, e o Código
    não define que horas começa o repouso noturno — quem delimita é o caso
    concreto.
  variantes:
    - furto noturno
    - furto durante o repouso noturno
    - aumento pelo repouso noturno
    - furto de madrugada
  dispositivos:
