- termo: distinção entre tráfico e uso
  slug: distincao-entre-trafico-e-uso
  tipo: tema
  explicacao: >-
    O § 2º do art. 28 dá os critérios que separam as duas condutas: natureza e
    quantidade da droga, local e condições da ação, circunstâncias sociais e
    pessoais, conduta e antecedentes. É a mesma pergunta vista dos dois lados.
