# =============================================================================
# Rubricas curadas — o apelido do instituto, escrito à mão.
#
# Por que este arquivo existe (decisão nº 2 do CLAUDE.md): advogado não busca
# pelo texto da lei, busca pelo apelido. "Tráfico privilegiado" não aparece em
# lugar nenhum do art. 33 § 4º; "olheiro" e "fogueteiro" não aparecem no art. 37.
# Sem esta camada, a busca lexical não acha, e a semântica erra feio — medido no
# banco antes de escrever este arquivo:
#
#   "tráfico privilegiado"      → art. 332 do CP (tráfico de INFLUÊNCIA)
#   "associação para o tráfico" → art. 149-A do CP (tráfico de PESSOAS)
#   "dosimetria da pena"        → arts. 68 e 49 do CP, sem o art. 42 da Lei
#
# As 414 rubricas `oficial` vêm da margem impressa do Vade Mecum e cobrem o
# Código Penal. A Lei de Drogas não tem NENHUMA — o Vade Mecum não imprime
# rubrica marginal nela. Este arquivo é essa lacuna, preenchida à mão.
#
# --- regras de escrita -------------------------------------------------------
#
# `termo` e `variantes` casam por IGUALDADE EXATA do texto normalizado (sem
# acento, caixa baixa) contra a consulta INTEIRA — ver a CTE `rub` em
# 0003_busca.sql. Não é match parcial: "quero saber sobre tráfico privilegiado"
# NÃO casa. Daí variantes serem o grosso do trabalho, e não enfeite.
#
# Não repetir termo de rubrica oficial: `rubricas.slug` é único, e uma curada com
# o slug de uma oficial quebraria o seed. Por isso não há aqui "fixação da pena",
# "cálculo da pena", "circunstâncias atenuantes", "reincidência", "tentativa" nem
# "substituição da pena" — todas já são oficiais, do Código Penal.
#
# Nem "associação criminosa": é oficial E é outro crime (art. 288 do CP). Apontar
# o apelido de um crime para o dispositivo de outro é exatamente o erro que esta
# camada existe para evitar.
#
# `explicacao` é texto autoral próprio, curto e funcional: diz o que o
# dispositivo faz. NÃO é resumo de doutrina — obra de Nucci, Greco ou Bitencourt
# não entra aqui em nenhuma forma (CLAUDE.md, "Restrição de doutrina").
#
# `papel` ordena o cluster no resultado: principal → correlato → requisito.
# `peso` desempata dentro do mesmo papel.
#
# Todo `id` abaixo foi conferido contra o banco antes de ser escrito. O seed
# falha com violação de chave estrangeira se algum deixar de existir — que é o
# comportamento desejado: id de citação quebrado tem de derrubar o seed, não
# aparecer em peça.
# =============================================================================

