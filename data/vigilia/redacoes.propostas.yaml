      a prisão provisória, ou por outro motivo relevante, o juiz reputar conveniente a separação.
    texto: Será facultativa a separação dos processos quando as infrações tiverem sido praticadas em circunstâncias
      de tempo ou de lugar diferentes, ou, quando pelo excessivo número de acusados e para não Ihes prolongar
      a prisão provisória, ou por outro motivo relevante, o juiz reputar conveniente a separação.
