    tipo: caput
    acao: alterar
    era: O juiz, a requerimento do Ministério Público ou do assistente de acusação, ou mediante representação
      da autoridade de polícia judiciária, poderá decretar, no curso do inquérito ou da ação penal, a
      apreensão e outras medidas assecuratórias nos casos em que haja suspeita de que os bens, direitos
      ou valores sejam produto do crime ou constituam proveito dos crimes previstos nesta Lei, procedendo-se
      na forma dos arts. 125 e seguintes do Decreto-lei nº 3.689, de 3 de outubro de 1941 – Código de
      Processo Penal.
