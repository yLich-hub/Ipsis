    acao: alterar
    era: É também aplicável a lei brasileira aos crimes praticados a bordo de aeronaves ou embarcações
      estrangeiras de propriedade privada, achando-se aquelas em pouso no território nacional ou em voo
      no espaço aéreo correspondente, e estas em porto ou mar territorial do Brasil.
    texto: É também aplicável a lei brasileira aos crimes praticados a bordo de aeronaves ou embarcações
      estrangeiras de propriedade privada, achando-se aquelas em pouso no território nacional ou em vôo
      no espaço aéreo correspondente, e estas em porto ou mar territorial do Brasil.
