    tipo: caput
    acao: alterar
    era: Verificar-se-á a competência por prevenção toda vez que, concorrendo dois ou mais juízes igualmente
      competentes ou com jurisdição cumulativa, um deles tiver antecedido aos outros na prática de algum
      ato do processo ou de medida a este relativa, ainda que anterior ao oferecimento da denúncia ou
      da queixa (arts. 70, § 3º, 71, 72, § 2º, e 78, II, “c”).
    texto: Verificar-se-á a competência por prevenção toda vez que, concorrendo dois ou mais juízes igualmente
      competentes ou com jurisdição cumulativa, um deles tiver antecedido aos outros na prática de algum
      ato do processo ou de medida a este relativa, ainda que anterior ao oferecimento da denúncia ou
      da queixa (arts. 70, § 3o, 71, 72, § 2o, e 78, II, c).
