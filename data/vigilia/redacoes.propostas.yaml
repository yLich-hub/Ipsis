    rotulo: caput
    tipo: caput
    acao: alterar
    era: 'Omitir, em documento público ou particular, declaração que dele devia constar, ou nele inserir
      ou fazer inserir declaração falsa ou diversa da que devia ser escrita, com o fim de prejudicar direito,
      criar obrigação ou alterar a verdade sobre fato juridicamente relevante: Pena – reclusão, de um
      a cinco anos, e multa, se o documento é público, e reclusão, de um a três anos, e multa, se o documento
      é particular.'
    texto: 'Omitir, em documento público ou particular, declaração que dele devia constar, ou nele inserir
      ou fazer inserir declaração falsa ou diversa da que devia ser escrita, com o fim de prejudicar direito,
      criar obrigação ou alterar a verdade sobre fato juridicamente relevante: Pena - reclusão, de um
      a cinco anos, e multa, se o documento é público, e reclusão de um a três anos, e multa, de quinhentos
      mil réis a cinco contos de réis, se o documento é particular.'
