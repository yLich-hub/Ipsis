  - id: dl_2848_1940_art121_p4
    artigo: dl_2848_1940_art121
    rotulo: § 4º
    tipo: paragrafo
    acao: alterar
    era: No homicídio culposo, a pena é aumentada de 1/3 (um terço), se o crime resulta de inobservância
      de regra técnica de profissão, arte ou ofício, ou se o agente deixa de prestar imediato socorro
      à vítima, não procura diminuir as consequências do seu ato, ou foge para evitar prisão em flagrante.
      Sendo doloso o homicídio, a pena é aumentada de 1/3 (um terço) se o crime é praticado contra pessoa
      menor de 14 (quatorze) ou maior de 60 (sessenta) anos.
    texto: No homicídio culposo, a pena é aumentada de 1/3 (um terço), se o crime resulta de inobservância
      de regra técnica de profissão, arte ou ofício, ou se o agente deixa de prestar imediato socorro
      à vítima, não procura diminuir as conseqüências do seu ato, ou foge para evitar prisão em flagrante.
      Sendo doloso o homicídio, a pena é aumentada de 1/3 (um terço) se o crime é praticado contra pessoa
      menor de 14 (quatorze) ou maior de 60 (sessenta) anos.
    normas:
    - Lei 10.741/2003
    depois_de: ''
